<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>MMLI Competition System</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0b1e3a;
            color: #f0f4fc;
            min-height: 100vh;
        }
        :root {
            --navy: #0e2c57;
            --gold: #f9c040;
            --gold-light: #ffd966;
            --white: #f0f4fc;
            --dark-bg: #0b1e3a;
            --card-bg: #142d5a;
            --shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
        }
        .app {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 16px 80px;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 20px 0 12px;
            border-bottom: 2px solid var(--gold);
            flex-wrap: wrap;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .logo svg {
            width: 48px;
            height: 48px;
        }
        .logo-text {
            font-weight: 700;
            font-size: 1.6rem;
            letter-spacing: 1px;
            color: var(--white);
        }
        .logo-text span {
            color: var(--gold);
        }
        .subhead {
            margin-left: auto;
            font-size: 0.9rem;
            background: var(--gold);
            color: #0b1e3a;
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: 600;
        }
        .nav-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 10px;
            margin: 16px 0 20px;
            background: var(--card-bg);
            padding: 8px 12px;
            border-radius: 60px;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-btn {
            background: transparent;
            border: none;
            color: #b0c8f0;
            padding: 8px 16px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .nav-btn.active {
            background: var(--gold);
            color: #0b1e3a;
            box-shadow: 0 4px 8px rgba(249, 192, 64, 0.3);
        }
        .nav-btn:hover {
            background: rgba(249, 192, 64, 0.15);
        }
        .card {
            background: var(--card-bg);
            border-radius: 28px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.05);
            animation: fadeUp 0.3s ease;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
        }
        .stat-number {
            font-size: 2.6rem;
            font-weight: 800;
            color: var(--gold);
            line-height: 1;
        }
        .stat-label {
            font-size: 0.9rem;
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .flex {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }
        .gap-8 {
            gap: 8px;
        }
        .btn {
            background: var(--gold);
            color: #0b1e3a;
            border: none;
            padding: 10px 24px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--gold);
            color: var(--gold);
        }
        .btn-sm {
            padding: 6px 16px;
            font-size: 0.8rem;
        }
        .btn-danger {
            background: #d45a5a;
            color: white;
        }
        .btn-success {
            background: #3ba87c;
            color: white;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .mb-12 {
            margin-bottom: 12px;
        }
        .mt-12 {
            margin-top: 12px;
        }
        .live-header {
            background: var(--navy);
            padding: 12px 20px;
            border-radius: 60px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            border-left: 6px solid var(--gold);
        }
        .question-badge {
            background: var(--gold);
            color: #0b1e3a;
            padding: 4px 16px;
            border-radius: 40px;
            font-weight: 700;
        }
        .student-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 8px;
            margin: 12px 0;
        }
        .student-btn {
            background: #1f3d70;
            border: 2px solid transparent;
            padding: 12px 4px;
            border-radius: 60px;
            text-align: center;
            font-weight: 600;
            font-size: 0.8rem;
            color: white;
            transition: 0.15s;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }
        .student-btn:active {
            transform: scale(0.94);
        }
        .student-btn.selected {
            border-color: var(--gold);
            background: #2a4a82;
        }
        .student-btn.correct {
            background: #2d8f5e;
            border-color: #7ddfb0;
        }
        .student-btn.wrong {
            background: #a04141;
            border-color: #e67a7a;
        }
        .category-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 12px 0;
        }
        .cat-btn {
            background: #1f3d70;
            border: 2px solid #2a4a82;
            padding: 8px 18px;
            border-radius: 60px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: 0.1s;
        }
        .cat-btn.active {
            background: var(--gold);
            color: #0b1e3a;
            border-color: var(--gold);
        }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a2f4a;
            color: white;
            padding: 12px 28px;
            border-radius: 60px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
            border-left: 6px solid var(--gold);
            z-index: 999;
            opacity: 0;
            transition: 0.3s;
            pointer-events: none;
            max-width: 90%;
        }
        .toast.show {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal {
            background: var(--card-bg);
            max-width: 600px;
            width: 100%;
            border-radius: 40px;
            padding: 28px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid var(--gold);
        }
        .modal h2 {
            color: var(--gold);
        }
        .input-field {
            width: 100%;
            padding: 14px 18px;
            border-radius: 40px;
            border: 2px solid #2a4a82;
            background: #0b1e3a;
            color: white;
            font-size: 1rem;
            margin-bottom: 10px;
        }
        .input-field:focus {
            border-color: var(--gold);
            outline: none;
        }
        .table-wrap {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        th {
            text-align: left;
            padding: 10px 6px;
            border-bottom: 2px solid var(--gold);
            color: var(--gold);
        }
        td {
            padding: 8px 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .text-gold {
            color: var(--gold);
        }
        .text-muted {
            opacity: 0.6;
        }
        .badge {
            background: var(--gold);
            color: #0b1e3a;
            padding: 2px 12px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.7rem;
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            opacity: 0.7;
        }
        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 12px;
        }
        @media (max-width: 640px) {
            .logo-text {
                font-size: 1.2rem;
            }
            .nav-row {
                gap: 4px;
            }
            .nav-btn {
                padding: 6px 10px;
                font-size: 0.7rem;
            }
            .student-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="app" id="app">
        <div class="header">
            <div class="logo">
                <svg viewBox="0 0 100 100" width="48" height="48">
                    <rect width="100" height="100" fill="#0e2c57" rx="20"/>
                    <text x="50" y="65" text-anchor="middle" fill="#f9c040" font-size="38" font-weight="800" font-family="Segoe UI, sans-serif">MM</text>
                    <text x="50" y="90" text-anchor="middle" fill="#f9c040" font-size="18" font-weight="600">LI</text>
                </svg>
                <div class="logo-text">MIND <span>MASTERS</span> · LI</div>
            </div>
            <div class="subhead">OFFLINE v1</div>
        </div>
        <div class="nav-row" id="navRow">
            <button class="nav-btn active" data-section="dashboard">📊 Dashboard</button>
            <button class="nav-btn" data-section="competitions">🏆 Comp</button>
            <button class="nav-btn" data-section="schools">🏫 Schools</button>
            <button class="nav-btn" data-section="students">👨‍🎓 Students</button>
            <button class="nav-btn" data-section="games">🎮 Games</button>
            <button class="nav-btn" data-section="live">⚡ Live</button>
            <button class="nav-btn" data-section="stats">📈 Stats</button>
            <button class="nav-btn" data-section="awards">🏅 Awards</button>
            <button class="nav-btn" data-section="backup">💾 Backup</button>
        </div>
        <div id="pageContent"></div>
        <div id="toast" class="toast">Ready</div>
    </div>

    <script>
        // ============================================================
        // MMLI COMPETITION SYSTEM - FULLY WORKING
        // ============================================================
        (function() {
            'use strict';

            // --- Constants ---
            const DB_NAME = 'MMLI_DB';
            const DB_VER = 3;
            const CATEGORIES = ['Mathematics', 'Science', 'English', 'History', 'General Knowledge'];
            const DIVISIONS = ['Junior High', 'Senior High'];

            // --- State ---
            let db = null;
            let currentCompetitionId = null;
            let currentDivision = 'Junior High';
            let liveState = null;

            // --- Utilities ---
            function uid() {
                return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
            }

            function toast(msg, dur = 2500) {
                const t = document.getElementById('toast');
                t.textContent = msg;
                t.classList.add('show');
                clearTimeout(t._hide);
                t._hide = setTimeout(() => t.classList.remove('show'), dur);
            }

            function showModal(html) {
                const overlay = document.createElement('div');
                overlay.className = 'modal-overlay';
                overlay.innerHTML = html;
                document.body.appendChild(overlay);
                return overlay;
            }

            function closeModal() {
                const modal = document.querySelector('.modal-overlay');
                if (modal) modal.remove();
            }

            // --- IndexedDB ---
            function openDB() {
                return new Promise((res, rej) => {
                    const req = indexedDB.open(DB_NAME, DB_VER);
                    req.onupgradeneeded = (e) => {
                        const d = e.target.result;
                        if (!d.objectStoreNames.contains('competitions')) d.createObjectStore('competitions', { keyPath: 'id' });
                        if (!d.objectStoreNames.contains('schools')) d.createObjectStore('schools', { keyPath: 'id' });
                        if (!d.objectStoreNames.contains('students')) d.createObjectStore('students', { keyPath: 'id' });
                        if (!d.objectStoreNames.contains('games')) d.createObjectStore('games', { keyPath: 'id' });
                        if (!d.objectStoreNames.contains('answerRecords')) d.createObjectStore('answerRecords', { keyPath: 'id' });
                        if (!d.objectStoreNames.contains('settings')) d.createObjectStore('settings', { keyPath: 'key' });

                        const store = d.objectStore('answerRecords');
                        if (!store.indexNames.contains('gameId')) store.createIndex('gameId', 'gameId', { unique: false });
                        if (!store.indexNames.contains('studentId')) store.createIndex('studentId', 'studentId', { unique: false });
                        if (!store.indexNames.contains('competitionId')) store.createIndex('competitionId', 'competitionId', { unique: false });
                        if (!store.indexNames.contains('division')) store.createIndex('division', 'division', { unique: false });
                    };
                    req.onsuccess = (e) => { db = e.target.result;
                        res(db); };
                    req.onerror = (e) => { rej(e.target.error); };
                });
            }

            function storePut(storeName, data) {
                return new Promise((res, rej) => {
                    const tx = db.transaction(storeName, 'readwrite');
                    const store = tx.objectStore(storeName);
                    const req = store.put(data);
                    req.onsuccess = () => res(req.result);
                    req.onerror = () => rej(req.error);
                });
            }

            function storeGetAll(storeName) {
                return new Promise((res, rej) => {
                    const tx = db.transaction(storeName, 'readonly');
                    const store = tx.objectStore(storeName);
                    const req = store.getAll();
                    req.onsuccess = () => res(req.result);
                    req.onerror = () => rej(req.error);
                });
            }

            function storeDelete(storeName, id) {
                return new Promise((res, rej) => {
                    const tx = db.transaction(storeName, 'readwrite');
                    const store = tx.objectStore(storeName);
                    const req = store.delete(id);
                    req.onsuccess = () => res();
                    req.onerror = () => rej(req.error);
                });
            }

            function storeGetByIndex(storeName, indexName, value) {
                return new Promise((res, rej) => {
                    const tx = db.transaction(storeName, 'readonly');
                    const store = tx.objectStore(storeName);
                    const idx = store.index(indexName);
                    const req = idx.getAll(value);
                    req.onsuccess = () => res(req.result);
                    req.onerror = () => rej(req.error);
                });
            }

            // --- Data API ---
            const API = {
                async init() {
                    await openDB();
                    await this.loadSettings();
                },

                async loadSettings() {
                    const s = await storeGetAll('settings');
                    const comp = s.find(x => x.key === 'currentCompetitionId');
                    if (comp) currentCompetitionId = comp.value;
                    const div = s.find(x => x.key === 'currentDivision');
                    if (div) currentDivision = div.value;
                },

                async setCurrentCompetition(id) {
                    currentCompetitionId = id;
                    await storePut('settings', { key: 'currentCompetitionId', value: id });
                },

                async setCurrentDivision(div) {
                    currentDivision = div;
                    await storePut('settings', { key: 'currentDivision', value: div });
                },

                async getCompetitions() { return await storeGetAll('competitions'); },
                async createCompetition(data) {
                    if (!data.id) data.id = 'comp_' + uid();
                    data.created = new Date().toISOString();
                    data.status = data.status || 'Draft';
                    await storePut('competitions', data);
                    return data;
                },
                async updateCompetition(data) { await storePut('competitions', data); return data; },
                async deleteCompetition(id) { await storeDelete('competitions', id); },

                async getSchools() { return await storeGetAll('schools'); },
                async createSchool(data) {
                    if (!data.id) data.id = 'sch_' + uid();
                    await storePut('schools', data);
                    return data;
                },
                async updateSchool(data) { await storePut('schools', data); return data; },
                async deleteSchool(id) { await storeDelete('schools', id); },

                async getStudents() { return await storeGetAll('students'); },
                async createStudent(data) {
                    if (!data.id) data.id = 'MMLI-STU-' + String(100000 + Math.floor(Math.random() * 900000));
                    await storePut('students', data);
                    return data;
                },
                async updateStudent(data) { await storePut('students', data); return data; },
                async deleteStudent(id) { await storeDelete('students', id); },
                async getStudentsBySchool(schoolId) {
                    const all = await this.getStudents();
                    return all.filter(s => s.school === schoolId);
                },

                async getGames() { return await storeGetAll('games'); },
                async getGamesByCompetition(compId) {
                    const all = await this.getGames();
                    return all.filter(g => g.competition === compId);
                },
                async createGame(data) {
                    if (!data.id) data.id = 'game_' + uid();
                    data.status = data.status || 'Scheduled';
                    data.firstHalfStatus = data.firstHalfStatus || 'Not Started';
                    data.secondHalfStatus = data.secondHalfStatus || 'Not Started';
                    await storePut('games', data);
                    return data;
                },
                async updateGame(data) { await storePut('games', data); return data; },
                async deleteGame(id) {
                    const answers = await this.getAnswersForGame(id);
                    for (let a of answers) await storeDelete('answerRecords', a.id);
                    await storeDelete('games', id);
                },

                async getAnswers() { return await storeGetAll('answerRecords'); },
                async getAnswersForGame(gameId) {
                    return await storeGetByIndex('answerRecords', 'gameId', gameId);
                },
                async getAnswersForCompetition(compId) {
                    return await storeGetByIndex('answerRecords', 'competitionId', compId);
                },
                async recordAnswer(data) {
                    if (!data.id) data.id = 'ans_' + uid();
                    data.timestamp = data.timestamp || new Date().toISOString();
                    await storePut('answerRecords', data);
                    return data;
                },
                async updateAnswer(data) { await storePut('answerRecords', data); return data; },
                async deleteAnswer(id) { await storeDelete('answerRecords', id); },

                calcStudentStats(answers, studentId) {
                    const a = answers.filter(r => r.studentId === studentId);
                    let total = 0,
                        correct = 0,
                        wrong = 0;
                    const cats = { English: 0, Science: 0, History: 0, Mathematics: 0, 'General Knowledge': 0 };
                    a.forEach(r => {
                        total++;
                        if (r.result === 'Correct') correct++;
                        else wrong++;
                        if (cats[r.category] !== undefined) cats[r.category]++;
                    });
                    return { total, correct, wrong, accuracy: total ? Math.round((correct / total) * 100) : 0, ...cats };
                },

                getAwardWinners(answers, students, division) {
                    const divStudents = students.filter(s => s.division === division);
                    const divAnswers = answers.filter(a => a.division === division);
                    const stats = divStudents.map(stu => {
                        const s = this.calcStudentStats(divAnswers, stu.id);
                        return { ...stu, stats: s };
                    });

                    const awards = {};
                    const catKeys = ['Mathematics', 'Science', 'English', 'History'];
                    catKeys.forEach(cat => {
                        const sorted = [...stats].filter(s => s.stats[cat] > 0).sort((a, b) => b.stats[cat] - a.stats[cat]);
                        if (sorted.length) {
                            const top = sorted[0];
                            const ties = sorted.filter(s => s.stats[cat] === top.stats[cat]);
                            awards['Best ' + cat] = ties.map(t => t.fullName + ' (' + t.stats[cat] + ')').join(' & ');
                        } else {
                            awards['Best ' + cat] = '—';
                        }
                    });

                    const sortedMVQ = [...stats].filter(s => s.stats.total > 0).sort((a, b) => b.stats.total - a.stats.total);
                    if (sortedMVQ.length) {
                        const top = sortedMVQ[0];
                        const ties = sortedMVQ.filter(s => s.stats.total === top.stats.total);
                        awards['MVQ'] = ties.map(t => t.fullName + ' (' + t.stats.total + ')').join(' & ');
                    } else {
                        awards['MVQ'] = '—';
                    }
                    return awards;
                }
            };

            // --- Navigation ---
            const nav = {
                currentSection: 'dashboard',

                go(section) {
                    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                    const btn = document.querySelector(`.nav-btn[data-section="${section}"]`);
                    if (btn) btn.classList.add('active');
                    this.currentSection = section;
                    this.render(section);
                },

                render(section) {
                    switch (section) {
                        case 'dashboard':
                            renderDashboard();
                            break;
                        case 'competitions':
                            renderCompetitions();
                            break;
                        case 'schools':
                            renderSchools();
                            break;
                        case 'students':
                            renderStudents();
                            break;
                        case 'games':
                            renderGames();
                            break;
                        case 'live':
                            renderLive();
                            break;
                        case 'stats':
                            renderStats();
                            break;
                        case 'awards':
                            renderAwards();
                            break;
                        case 'backup':
                            renderBackup();
                            break;
                    }
                }
            };

            // --- Render Functions ---

            async function renderDashboard() {
                const comps = await API.getCompetitions();
                const games = await API.getGames();
                const students = await API.getStudents();
                const schools = await API.getSchools();
                const answers = await API.getAnswers();
                const active = comps.find(c => c.id === currentCompetitionId);
                const compGames = games.filter(g => g.competition === currentCompetitionId);
                const compAnswers = answers.filter(a => a.competitionId === currentCompetitionId);
                const divStudents = students.filter(s => s.division === currentDivision);

                let html = `
                    <div class="card">
                        <div class="flex">
                            <span class="stat-label">Active Competition</span>
                            <span class="stat-number" style="font-size:1.6rem">${active ? active.name : 'None selected'}</span>
                            <button class="btn btn-sm btn-outline" onclick="nav.go('competitions')">Change</button>
                        </div>
                    </div>
                    <div class="grid-2">
                        <div class="card"><div class="stat-number">${compGames.length}</div><div class="stat-label">Games</div></div>
                        <div class="card"><div class="stat-number">${divStudents.length}</div><div class="stat-label">Students (${currentDivision})</div></div>
                        <div class="card"><div class="stat-number">${schools.length}</div><div class="stat-label">Schools</div></div>
                        <div class="card"><div class="stat-number">${compAnswers.length}</div><div class="stat-label">Questions Recorded</div></div>
                    </div>
                    <div class="card">
                        <div class="flex gap-8">
                            <span class="stat-label">Division:</span>
                            <button class="btn btn-sm ${currentDivision === 'Junior High' ? 'btn-success' : 'btn-outline'}" onclick="setDivision('Junior High')">Junior High</button>
                            <button class="btn btn-sm ${currentDivision === 'Senior High' ? 'btn-success' : 'btn-outline'}" onclick="setDivision('Senior High')">Senior High</button>
                        </div>
                    </div>
                `;
                document.getElementById('pageContent').innerHTML = html;
            }

            window.setDivision = async function(div) {
                await API.setCurrentDivision(div);
                nav.go('dashboard');
            };

            // --- COMPETITIONS ---
            async function renderCompetitions() {
                const comps = await API.getCompetitions();
                let html = `
                    <div class="card">
                        <h2>🏆 Competitions</h2>
                        <button class="btn btn-sm" onclick="showCompForm()">+ New Competition</button>
                        <div class="mt-12">
                `;

            // --- LIVE GAME ---
            window.startLiveGame = async function(gameId) {
                const games = await API.getGames();
                const game = games.find(g => g.id === gameId);
                if (!game) { toast('Game not found'); return; }

                const answers = await API.getAnswersForGame(gameId);
                const sorted = [...answers].sort((a, b) => a.timestamp.localeCompare(b.timestamp));

                liveState = {
                    gameId: gameId,
                    half: 1,
                    questionNumber: sorted.length,
                    category: sorted.length > 0 ? sorted[sorted.length - 1].category : 'Mathematics',
                    selectedStudent: null,
                    answers: sorted,
                    game: game
                };

                nav.go('live');
            };

            async function renderLive() {
                if (!liveState) {
                    document.getElementById('pageContent').innerHTML = `
                        <div class="card">
                            <h2>⚡ Live Game</h2>
                            <div class="empty-state">
                                <div class="icon">🎯</div>
                                <p>Select a game from the Games section and click "Live".</p>
                            </div>
                        </div>
                    `;
                    return;
                }

                const schools = await API.getSchools();
                const students = await API.getStudents();
                const game = liveState.game;
                const schA = schools.find(s => s.id === game.schoolA);
                const schB = schools.find(s => s.id === game.schoolB);
                const stuA = students.filter(s => s.school === game.schoolA && s.division === game.division);
                const stuB = students.filter(s => s.school === game.schoolB && s.division === game.division);
                const allStu = [...stuA, ...stuB];

                let studentButtons = '';
                allStu.forEach(stu => {
                    const answered = liveState.answers.find(a =>
                        a.studentId === stu.id &&
                        a.half === liveState.half &&
                        a.questionNumber === liveState.questionNumber
                    );
                    let cls = 'student-btn';
                    if (answered) cls += answered.result === 'Correct' ? ' correct' : ' wrong';
                    if (liveState.selectedStudent === stu.id) cls += ' selected';
                    studentButtons +=
                        `<div class="${cls}" onclick="liveSelectStudent('${stu.id}')">${stu.fullName}</div>`;
                });

                let catButtons = CATEGORIES.map(c =>
                    `<button class="cat-btn ${c === liveState.category ? 'active' : ''}" onclick="liveSetCategory('${c}')">${c}</button>`
                ).join('');

                let statsHtml = `<div class="table-wrap"><table>
                    <tr><th>Student</th><th>Math</th><th>Sci</th><th>Eng</th><th>Hist</th><th>GK</th><th>Total</th><th>Acc%</th></tr>`;
                allStu.forEach(stu => {
                    const s = API.calcStudentStats(liveState.answers, stu.id);
                    statsHtml +=
                        `<tr><td>${stu.fullName}</td><td>${s.Mathematics||0}</td><td>${s.Science||0}</td><td>${s.English||0}</td><td>${s.History||0}</td><td>${s['General Knowledge']||0}</td><td>${s.total}</td><td>${s.accuracy}%</td></tr>`;
                });
                statsHtml += `</table></div>`;

                const html = `
                    <div class="card">
                        <div class="live-header">
                            <span>⚡ Game ${game.gameNumber} · ${game.division}</span>
                            <span>${schA ? schA.name : '?'} vs ${schB ? schB.name : '?'}</span>
                            <span class="question-badge">Q${liveState.questionNumber + 1} · ${liveState.category}</span>
                            <span>Half ${liveState.half}</span>
                        </div>
                        <div class="category-row">${catButtons}</div>
                        <div><strong>Select student who answered:</strong></div>
                        <div class="student-grid">${studentButtons}</div>
                        <div class="flex">
                            <button class="btn btn-success" onclick="liveRecord('Correct')">✔ Correct</button>
                            <button class="btn btn-danger" onclick="liveRecord('Wrong')">✘ Wrong</button>
                            <button class="btn btn-outline" onclick="liveNextQuestion()">Next Q →</button>
                            <button class="btn btn-outline" onclick="liveEndHalf()">⏹ End Half</button>
                            <button class="btn btn-outline" onclick="liveEndGame()">🏁 End Game</button>
                        </div>
                        <div class="mt-12">${statsHtml}</div>
                        <div class="mt-12"><button class="btn btn-sm" onclick="liveSaveAndExit()">💾 Save & Exit</button></div>
                    </div>
                `;
                document.getElementById('pageContent').innerHTML = html;
            }

            window.liveSetCategory = function(cat) {
                liveState.category = cat;
                renderLive();
            };

            window.liveSelectStudent = function(studentId) {
                liveState.selectedStudent = studentId;
                renderLive();
            };

            window.liveRecord = async function(result) {
                if (!liveState.selectedStudent) { toast('Select a student first'); return; }

                const students = await API.getStudents();
                const stu = students.find(s => s.id === liveState.selectedStudent);
                if (!stu) { toast('Student not found'); return; }

                const existing = liveState.answers.find(a =>
                    a.half === liveState.half &&
                    a.questionNumber === liveState.questionNumber &&
                    a.category === liveState.category
                );

                const data = {
                    competitionId: liveState.game.competition,
                    division: liveState.game.division,
                    gameId: liveState.gameId,
                    half: liveState.half,
                    questionNumber: liveState.questionNumber,
                    category: liveState.category,
                    studentId: liveState.selectedStudent,
                    schoolId: stu.school,
                    result: result,
                };

                if (existing) {
                    existing.studentId = liveState.selectedStudent;
                    existing.schoolId = stu.school;
                    existing.result = result;
                    existing.timestamp = new Date().toISOString();
                    await API.updateAnswer(existing);
                    toast('Answer updated');
                } else {
                    const newAnswer = await API.recordAnswer(data);
                    liveState.answers.push(newAnswer);
                    toast('Answer recorded');
                }

                liveState.selectedStudent = null;
                liveState.questionNumber++;
                renderLive();
            };

            window.liveNextQuestion = function() {
                liveState.selectedStudent = null;
                liveState.questionNumber++;
                renderLive();
            };

            window.liveEndHalf = function() {
                if (!confirm(`End Half ${liveState.half}?`)) return;
                if (liveState.half === 1) {
                    liveState.half = 2;
                    liveState.questionNumber = 0;
                    liveState.selectedStudent = null;
                    toast('Started Second Half');
                } else {
                    toast('Already in Second Half');
                }
                renderLive();
            };

            async function renderStats() {
                const answers = await API.getAnswersForCompetition(currentCompetitionId);
                const students = await API.getStudents();

                const divStudents = students.filter(s => s.division === currentDivision);

                } else {
                    html += `<div class="table-wrap"><table>
                        <tr><th>Rank</th><th>Student</th><th>School</th><th>Math</th><th>Sci</th><th>Eng</th><th>Hist</th><th>GK</th><th>Total</th><th>Acc%</th></tr>`;

                    const stats = divStudents.map(stu => {
                        const s = API.calcStudentStats(answers, stu.id);
                        const sch = schools.find(sc => sc.id === stu.school);
                        return { ...stu, stats: s, schoolName: sch ? sch.name : '?' };
                    });

                    const sorted = [...stats].sort((a, b) => b.stats.total - a.stats.total);
                    sorted.forEach((stu, idx) => {
                        html += `<tr>
                            <td>${idx + 1}</td>
                            <td><strong>${stu.fullName}</strong></td>
                            <td>${stu.schoolName}</td>
                            <td>${stu.stats.Mathematics||0}</td>
                            <td>${stu.stats.Science||0}</td>
                            <td>${stu.stats.English||0}</td>
                            <td>${stu.stats.History||0}</td>
                            <td>${stu.stats['General Knowledge']||0}</td>
                            <td><strong>${stu.stats.total}</strong></td>
                            <td>${stu.stats.accuracy}%</td>
                        </tr>`;
                    });
                    html += `</table></div>`;
                }
                html += `</div>`;
                document.getElementById('pageContent').innerHTML = html;
            }

            // --- AWARDS ---
            async function renderAwards() {
                const answers = await API.getAnswersForCompetition(currentCompetitionId);
                const students = await API.getStudents();

                let html = `
                    <div class="card">
                        <h2>🏅 Awards · ${currentDivision}</h2>
                        <div class="grid-2">
                `;

                DIVISIONS.forEach(div => {
                    const awards = API.getAwardWinners(answers, students, div);
                    html += `<div class="card">
                        <h3>${div}</h3>
                        ${Object.entries(awards).map(([k, v]) => `<p><strong>${k}:</strong> ${v}</p>`).join('')}
                    </div>`;
                });

                html += `</div></div>`;
                document.getElementById('pageContent').innerHTML = html;
            }

            // --- BACKUP ---
            async function renderBackup() {
                const html = `
                    <div class="card">
                        <h2>💾 Backup & Restore</h2>
                        <div class="flex">
                            <button class="btn" onclick="exportBackup()">📤 Export Database</button>
                            <button class="btn btn-outline" onclick="document.getElementById('importFile').click()">📥 Import</button>
                            <input type="file" id="importFile" accept=".json" style="display:none" onchange="importBackup(event)">
                        </div>
                        <p class="text-muted mt-12">Exports all competitions, schools, students, games, and answer records.</p>
                        <p class="text-muted">Last backup: <span id="lastBackup">Never</span></p>
                    </div>
                `;
                document.getElementById('pageContent').innerHTML = html;

                const settings = await storeGetAll('settings');
                const backupTime = settings.find(s => s.key === 'lastBackup');
                if (backupTime) {
                    document.getElementById('lastBackup').textContent = new Date(backupTime.value).toLocaleString();
                }
            }

            window.exportBackup = async function() {
                const data = {
                    schemaVersion: 1,
                    exported: new Date().toISOString(),
                    competitions: await API.getCompetitions(),
                    schools: await API.getSchools(),
                    students: await API.getStudents(),
                    games: await API.getGames(),
                    answerRecords: await API.getAnswers(),
                };

                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `MMLI_Backup_${new Date().toISOString().slice(0, 10)}.json`;
                a.click();
                URL.revokeObjectURL(url);

                await storePut('settings', { key: 'lastBackup', value: new Date().toISOString() });
                toast('Backup exported');
                renderBackup();
            };

            window.importBackup = async function(event) {
                const file = event.target.files[0];
                if (!file) return;

                try {
                    const text = await file.text();
                    const data = JSON.parse(text);

                    if (!data.schemaVersion) { toast('Invalid backup file'); return; }
                    if (!confirm('Import will REPLACE all current data. Continue?')) return;

                    const stores = ['competitions', 'schools', 'students', 'games', 'answerRecords'];
                    for (let s of stores) {
                        const all = await storeGetAll(s);
                        for (let item of all) await storeDelete(s, item.id);
                    }

                    for (let c of data.competitions || []) await storePut('competitions', c);
                    for (let s of data.schools || []) await storePut('schools', s);
                    for (let s of data.students || []) await storePut('students', s);
                    for (let g of data.games || []) await storePut('games', g);
                    for (let a of data.answerRecords || []) await storePut('answerRecords', a);

                    await API.loadSettings();
                    toast('Import successful!');
                    nav.go('dashboard');
                } catch (e) {
                    toast('Import error: ' + e.message);
                }
                event.target.value = '';
            };

            // --- INITIALIZATION ---
            window.API = API;
            window.nav = nav;

            // Set up navigation event listeners
            document.addEventListener('DOMContentLoaded', async () => {
                try {
                    await API.init();

                    // Attach navigation click handlers
                    document.querySelectorAll('.nav-btn').forEach(btn => {
                        btn.addEventListener('click', function(e) {
                            const section = this.dataset.section;
                            if (section) nav.go(section);
                        });
                    });

                    // Start with dashboard
                    nav.go('dashboard');
                    toast('MMLI System ready');

                    // Also handle any dynamically created buttons via delegation
                    document.addEventListener('click', function(e) {
                        // Handle modal close for overlay clicks
                        if (e.target.classList.contains('modal-overlay')) {
                            closeModal();
                        }
                    });

                } catch (e) {
                    toast('Error initializing: ' + e.message);
                    console.error(e);
                }
            });

            // Make functions globally accessible for inline onclick
            window.closeModal = closeModal;
            window.toast = toast;

        })();
    </script>
</body>
</html>
