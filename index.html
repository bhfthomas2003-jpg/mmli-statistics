    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0b1e3a;
            color: #f0f4fc;
            min-height: 100vh;
        }
        :root {
            --navy: #0e2c57;
            --gold: #f9c040;
            --gold-light: #ffd966;
            --white: #f0f4fc;
            --dark-bg: #0b1e3a;
            --card-bg: #142d5a;
            --shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
        }
        .app {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 16px 80px;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 20px 0 12px;
            border-bottom: 2px solid var(--gold);
            flex-wrap: wrap;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .logo svg {
            width: 48px;
            height: 48px;
        }
        .logo-text {
            font-weight: 700;
            font-size: 1.6rem;
            letter-spacing: 1px;
            color: var(--white);
        }
        .logo-text span {
            color: var(--gold);
        }
        .subhead {
            margin-left: auto;
            font-size: 0.9rem;
            background: var(--gold);
            color: #0b1e3a;
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: 600;
        }
        .nav-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 10px;
            margin: 16px 0 20px;
            background: var(--card-bg);
            padding: 8px 12px;
            border-radius: 60px;
            box-shadow: var(--shadow);
        }
        .nav-btn {
            background: transparent;
            border: none;
            color: #b0c8f0;
            padding: 8px 16px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .nav-btn.active {
            background: var(--gold);
            color: #0b1e3a;
            box-shadow: 0 4px 8px rgba(249, 192, 64, 0.3);
        }
        .nav-btn:hover {
            background: rgba(249, 192, 64, 0.15);
        }
        .card {
            background: var(--card-bg);
            border-radius: 28px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.05);
            animation: fadeUp 0.3s ease;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
        }
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
        }
        .stat-number {
            font-size: 2.6rem;
            font-weight: 800;
            color: var(--gold);
            line-height: 1;
        }
        .stat-label {
            font-size: 0.9rem;
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .flex {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }
        .gap-8 {
            gap: 8px;
        }
        .btn {
            background: var(--gold);
            color: #0b1e3a;
            border: none;
            padding: 10px 24px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--gold);
            color: var(--gold);
        }
        .btn-sm {
            padding: 6px 16px;
            font-size: 0.8rem;
        }
        .btn-danger {
            background: #d45a5a;
            color: white;
        }
        .btn-success {
            background: #3ba87c;
            color: white;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .mb-12 {
            margin-bottom: 12px;
        }
        .mt-12 {
            margin-top: 12px;
        }
        .live-header {
            background: var(--navy);
            padding: 12px 20px;
            border-radius: 60px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            border-left: 6px solid var(--gold);
        }
        .question-badge {
            background: var(--gold);
            color: #0b1e3a;
            padding: 4px 16px;
            border-radius: 40px;
            font-weight: 700;
        }
        .student-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 8px;
            margin: 12px 0;
        }
        .student-btn {
            background: #1f3d70;
            border: 2px solid transparent;
            padding: 12px 4px;
            border-radius: 60px;
            text-align: center;
            font-weight: 600;
            font-size: 0.8rem;
            color: white;
            transition: 0.15s;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }
        .student-btn:active {
            transform: scale(0.94);
        }
        .student-btn.selected {
            border-color: var(--gold);
            background: #2a4a82;
        }
        .student-btn.correct {
            background: #2d8f5e;
            border-color: #7ddfb0;
        }
        .student-btn.wrong {
            background: #a04141;
            border-color: #e67a7a;
        }
        .category-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 12px 0;
        }
        .cat-btn {
            background: #1f3d70;
            border: 2px solid #2a4a82;
            padding: 8px 18px;
            border-radius: 60px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: 0.1s;
        }
        .cat-btn.active {
            background: var(--gold);
            color: #0b1e3a;
            border-color: var(--gold);
        }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a2f4a;
            color: white;
            padding: 12px 28px;
            border-radius: 60px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
            border-left: 6px solid var(--gold);
            z-index: 999;
            opacity: 0;
            transition: 0.3s;
            pointer-events: none;
            max-width: 90%;
        }
        .toast.show {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal {
            background: var(--card-bg);
            max-width: 600px;
            width: 100%;
            border-radius: 40px;
            padding: 28px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid var(--gold);

        .modal h2 {

        }
        .input-field {
            width: 100%;
            padding: 14px 18px;
            border-radius: 40px;
            border: 2px solid #2a4a82;
            background: #0b1e3a;
            color: white;
            font-size: 1rem;
            margin-bottom: 10px;
        }
        .input-field:focus {
            border-color: var(--gold);
            outline: none;
        }
        .table-wrap {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        th {
            text-align: left;
            padding: 10px 6px;
            border-bottom: 2px solid var(--gold);
            color: var(--gold);
        }
        td {
            padding: 8px 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .text-gold {
            color: var(--gold);
        }
        .text-muted {
            opacity: 0.6;
        }
        .badge {
            background: var(--gold);
            color: #0b1e3a;
            padding: 2px 12px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.7rem;
        }
        @media (max-width: 640px) {
            .logo-text {
                font-size: 1.2rem;
            }
            .nav-row {
                gap: 4px;
            }
            .nav-btn {
                padding: 6px 12px;
                font-size: 0.75rem;
            }
            .student-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        .clickable {
            cursor: pointer;
            transition: 0.2s;
        }
        .clickable:hover {
            opacity: 0.8;
        }
    </style>

<body>
    <div class="app" id="app">
        <div class="header">
            <div class="logo">
                <svg viewBox="0 0 100 100" width="48" height="48"><rect width="100" height="100" fill="#0e2c57" rx="20"/><text x="50" y="65" text-anchor="middle" fill="#f9c040" font-size="38" font-weight="800" font-family="Segoe UI, sans-serif">MM</text><text x="50" y="90" text-anchor="middle" fill="#f9c040" font-size="18" font-weight="600">LI</text></svg>
                <div class="logo-text">MIND <span>MASTERS</span> · LI</div>
            </div>
            <div class="subhead">OFFLINE v1</div>
        </div>
        <div class="nav-row" id="navRow">
            <button class="nav-btn active" data-section="dashboard">📊 Dashboard</button>
            <button class="nav-btn" data-section="competitions">🏆 Comp</button>
            <button class="nav-btn" data-section="schools">🏫 Schools</button>
            <button class="nav-btn" data-section="students">👨‍🎓 Students</button>
            <button class="nav-btn" data-section="games">🎮 Games</button>
            <button class="nav-btn" data-section="live">⚡ Live</button>
            <button class="nav-btn" data-section="stats">📈 Stats</button>
            <button class="nav-btn" data-section="awards">🏅 Awards</button>
            <button class="nav-btn" data-section="backup">💾 Backup</button>
        </div>
        <div id="pageContent"></div>
        <div id="toast" class="toast">Ready</div>
    </div>
    <script>
        // ============================================================
        // MMLI COMPETITION SYSTEM - Full Production Implementation
        // ============================================================
        (function() {
            const DB_NAME = 'MMLI_DB';
            const DB_VER = 2;
            let db = null;
            let currentCompetitionId = null;
            let currentDivision = 'Junior High';

            // --- Live game state ---
            let liveGame = null; // current game object
            let liveHalf = 1; // 1 or 2
            let liveQuestionNumber = 0;
            let liveCategory = 'Mathematics';
            let liveSelectedStudent = null; // student id
            let liveAnswers = []; // answer records for this game (temp, saved on end)

            function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

            function toast(msg, dur = 2500) {
                const t = document.getElementById('toast');
                t.textContent = msg;
                t.classList.add('show');
                clearTimeout(t._hide);
                t._hide = setTimeout(() => t.classList.remove('show'), dur);
            }

            // --- IndexedDB ---
            function openDB() {
                return new Promise((res, rej) => {
                    const req = indexedDB.open(DB_NAME, DB_VER);
                    req.onupgradeneeded = (e) => {
                        const d = e.target.result;
                        if (!d.objectStoreNames.contains('competitions')) d.createObjectStore('competitions', { keyPath: 'id' });
                        if (!d.objectStoreNames.contains('schools')) d.createObjectStore('schools', { keyPath: 'id' });
                        if (!d.objectStoreNames.contains('students')) d.createObjectStore('students', { keyPath: 'id' });
                        if (!d.objectStoreNames.contains('games')) d.createObjectStore('games', { keyPath: 'id' });
                        if (!d.objectStoreNames.contains('answerRecords')) d.createObjectStore('answerRecords', { keyPath: 'id' });
                        if (!d.objectStoreNames.contains('settings')) d.createObjectStore('settings', { keyPath: 'key' });
                        // indexes
                        if (!d.objectStoreNames.contains('answerRecords')) return;
                        const store = d.objectStore('answerRecords');
                        if (!store.indexNames.contains('gameId')) store.createIndex('gameId', 'gameId', { unique: false });
                        if (!store.indexNames.contains('studentId')) store.createIndex('studentId', 'studentId', { unique: false });
                        if (!store.indexNames.contains('competitionId')) store.createIndex('competitionId', 'competitionId', { unique: false });
                        if (!store.indexNames.contains('division')) store.createIndex('division', 'division', { unique: false });
                    };
                    req.onsuccess = (e) => { db = e.target.result;
                        res(db); };
                    req.onerror = (e) => { rej(e.target.error); };
                });
            }

            function storePut(storeName, data) {
                return new Promise((res, rej) => {
                    const tx = db.transaction(storeName, 'readwrite');
                    const store = tx.objectStore(storeName);
                    const req = store.put(data);
                    req.onsuccess = () => res(req.result);
                    req.onerror = () => rej(req.error);
                });
            }

            function storeGetAll(storeName) {
                return new Promise((res, rej) => {
                    const tx = db.transaction(storeName, 'readonly');
                    const store = tx.objectStore(storeName);
                    const req = store.getAll();
                    req.onsuccess = () => res(req.result);
                    req.onerror = () => rej(req.error);
                });
            }

            function storeDelete(storeName, id) {
                return new Promise((res, rej) => {
                    const tx = db.transaction(storeName, 'readwrite');
                    const store = tx.objectStore(storeName);
                    const req = store.delete(id);
                    req.onsuccess = () => res();
                    req.onerror = () => rej(req.error);
                });
            }

            function storeGetByIndex(storeName, indexName, value) {
                return new Promise((res, rej) => {
                    const tx = db.transaction(storeName, 'readonly');
                    const store = tx.objectStore(storeName);
                    const idx = store.index(indexName);
                    const req = idx.getAll(value);
                    req.onsuccess = () => res(req.result);
                    req.onerror = () => rej(req.error);
                });
            }

            // --- Data API ---
            const API = {
                async init() {
                    await openDB();
                    await this.loadSettings();
                },
                async loadSettings() {
                    const s = await storeGetAll('settings');
                    const comp = s.find(x => x.key === 'currentCompetitionId');
                    if (comp) currentCompetitionId = comp.value;
                    const div = s.find(x => x.key === 'currentDivision');
                    if (div) currentDivision = div.value;
                },
                async setCurrentCompetition(id) {
                    currentCompetitionId = id;
                    await storePut('settings', { key: 'currentCompetitionId', value: id });
                },
                async setCurrentDivision(div) {
                    currentDivision = div;
                    await storePut('settings', { key: 'currentDivision', value: div });
                },
                async getCompetitions() { return await storeGetAll('competitions'); },
                async getSchools() { return await storeGetAll('schools'); },
                async getStudents() { return await storeGetAll('students'); },
                async getGames() { return await storeGetAll('games'); },
                async getAnswers() { return await storeGetAll('answerRecords'); },
                async getAnswersForGame(gameId) {
                    return await storeGetByIndex('answerRecords', 'gameId', gameId);
                },
                async createCompetition(data) {
                    if (!data.id) data.id = 'comp_' + uid();
                    data.created = new Date().toISOString();
                    await storePut('competitions', data);
                    return data;
                },
                async updateCompetition(data) {
                    await storePut('competitions', data);
                    return data;
                },
                async createSchool(data) {
                    if (!data.id) data.id = 'sch_' + uid();
                    await storePut('schools', data);
                    return data;
                },
                async updateSchool(data) {
                    await storePut('schools', data);
                    return data;
                },
                async createStudent(data) {
                    if (!data.id) data.id = 'MMLI-STU-' + String(100000 + Math.floor(Math.random() * 900000));
                    await storePut('students', data);
                    return data;
                },
                async updateStudent(data) {
                    await storePut('students', data);
                    return data;
                },
                async createGame(data) {
                    if (!data.id) data.id = 'game_' + uid();
                    data.status = data.status || 'Scheduled';
                    data.firstHalfStatus = 'Not Started';
                    data.secondHalfStatus = 'Not Started';
                    await storePut('games', data);
                    return data;
                },
                async updateGame(data) {
                    await storePut('games', data);
                    return data;
                },
                async recordAnswer(data) {
                    if (!data.id) data.id = 'ans_' + uid();
                    data.timestamp = new Date().toISOString();
                    await storePut('answerRecords', data);
                    return data;
                },
                async deleteAnswer(id) {
                    await storeDelete('answerRecords', id);
                },
                async getAnswersForCompetition(compId) {
                    return await storeGetByIndex('answerRecords', 'competitionId', compId);
                },
                async getStudentsBySchool(schoolId) {
                    const all = await this.getStudents();
                    return all.filter(s => s.school === schoolId);
                },
                // stats
                calcStudentStats(answers, studentId) {
                    const a = answers.filter(r => r.studentId === studentId);
                    let total = 0,
                        correct = 0,
                        wrong = 0;
                    const cats = { English: 0, Science: 0, History: 0, Mathematics: 0, 'General Knowledge': 0 };
                    a.forEach(r => {
                        total++;
                        if (r.result === 'Correct') correct++;
                        else wrong++;
                        if (cats[r.category] !== undefined) cats[r.category]++;
                    });
                    return { total, correct, wrong, accuracy: total ? Math.round(correct / total * 100) : 0, ...cats };
                },
                // award winners per division
                getAwardWinners(answers, students, division) {
                    const divStudents = students.filter(s => s.division === division);
                    const divAnswers = answers.filter(a => a.division === division);
                    const stats = divStudents.map(stu => {
                        const s = this.calcStudentStats(divAnswers, stu.id);
                        return { ...stu, stats: s };
                    });
                    const categories = ['Mathematics', 'Science', 'English', 'History'];
                    const awards = {};
                    categories.forEach(cat => {
                        const sorted = [...stats].filter(s => s.stats[cat] > 0).sort((a, b) => b.stats[cat] - a.stats[cat]);
                        if (sorted.length) {
                            const top = sorted[0];
                            const ties = sorted.filter(s => s.stats[cat] === top.stats[cat]);
                            awards['Best ' + cat] = ties.map(t => t.fullName + ' (' + t.stats[cat] + ')').join(' & ');
                        } else {
                            awards['Best ' + cat] = '—';
                        }
                    });
                    // MVQ (total across all categories)
                    const sortedMVQ = [...stats].filter(s => s.stats.total > 0).sort((a, b) => b.stats.total - a.stats.total);
                    if (sortedMVQ.length) {
                        const top = sortedMVQ[0];
                        const ties = sortedMVQ.filter(s => s.stats.total === top.stats.total);
                        awards['MVQ'] = ties.map(t => t.fullName + ' (' + t.stats.total + ')').join(' & ');
                    } else {
                        awards['MVQ'] = '—';
                    }
                    return awards;
                }
            };

            // --- UI Navigation ---
            const nav = {
                currentSection: 'dashboard',
                go(section) {
                    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                    document.querySelector(`.nav-btn[data-section="${section}"]`)?.classList.add('active');
                    this.currentSection = section;
                    this.render(section);
                },
                render(section) {
                    switch (section) {
                        case 'dashboard':
                            renderDashboard();
                            break;
                        case 'competitions':
                            renderCompetitions();
                            break;
                        case 'schools':
                            renderSchools();
                            break;
                        case 'students':
                            renderStudents();
                            break;
                        case 'games':
                            renderGames();
                            break;
                        case 'live':
                            renderLive();
                            break;
                        case 'stats':
                            renderStats();
                            break;
                        case 'awards':
                            renderAwards();
                            break;
                        case 'backup':
                            renderBackup();
                            break;
                    }
                }
            };

            // --- Render functions ---
            async function renderDashboard() {
                const comps = await API.getCompetitions();
                const games = await API.getGames();
                const students = await API.getStudents();
                const schools = await API.getSchools();
                const answers = await API.getAnswers();
                const active = comps.find(c => c.id === currentCompetitionId);
                const compGames = games.filter(g => g.competition === currentCompetitionId);
                const compAnswers = answers.filter(a => a.competitionId === currentCompetitionId);
                const html = `
                    <div class="card"><div class="flex"><span class="stat-label">Active Competition</span>
                        <span class="stat-number" style="font-size:1.6rem">${active ? active.name : 'None selected'}</span>
                        <button class="btn btn-sm btn-outline" onclick="nav.go('competitions')">Change</button>
                    </div></div>
                    <div class="grid-2">
                        <div class="card"><div class="stat-number">${compGames.length}</div><div class="stat-label">Games</div></div>
                        <div class="card"><div class="stat-number">${students.filter(s=>s.division===currentDivision).length}</div><div class="stat-label">Students (${currentDivision})</div></div>
                        <div class="card"><div class="stat-number">${schools.length}</div><div class="stat-label">Schools</div></div>
                        <div class="card"><div class="stat-number">${compAnswers.length}</div><div class="stat-label">Questions Recorded</div></div>

            // --- Live Game ---
            window.startLiveGame = async function(gameId) {
                const games = await API.getGames();
                const game = games.find(g => g.id === gameId);
                if (!game) { toast('Game not found'); return; }
                liveGame = game;
                liveHalf = 1;
                liveQuestionNumber = 0;
                liveCategory = 'Mathematics';
                liveSelectedStudent = null;
                liveAnswers = [];
                // Load existing answers for this game
                const existingAnswers = await API.getAnswersForGame(gameId);
                if (existingAnswers.length > 0) {
                    liveAnswers = existingAnswers;
                    // determine half and question number from last record
                    const sorted = [...existingAnswers].sort((a, b) => a.timestamp.localeCompare(b.timestamp));
                    const last = sorted[sorted.length - 1];
                    liveHalf = last.half || 1;
                    liveQuestionNumber = sorted.length;
                    // set category from last
                    liveCategory = last.category || 'Mathematics';
                }
                nav.go('live');
                renderLive();
            };

            async function renderLive() {
                if (!liveGame) {
                    document.getElementById('pageContent').innerHTML =
                        `<div class="card"><h2>⚡ Live Game</h2><p class="text-muted">Select a game from the Games section and click "Live".</p></div>`;
                    return;
                }
                const schools = await API.getSchools();
                const students = await API.getStudents();
                const schA = schools.find(s => s.id === liveGame.schoolA);
                const schB = schools.find(s => s.id === liveGame.schoolB);
                const stuA = students.filter(s => s.school === liveGame.schoolA && s.division === liveGame.division);
                const stuB = students.filter(s => s.school === liveGame.schoolB && s.division === liveGame.division);
                const allStu = [...stuA, ...stuB];

                // Build student buttons
                let studentButtons = '';
                allStu.forEach(stu => {
                    const answered = liveAnswers.find(a => a.studentId === stu.id && a.half === liveHalf && a
                    .questionNumber === liveQuestionNumber);
                    let cls = 'student-btn';
                    if (answered) cls += answered.result === 'Correct' ? ' correct' : ' wrong';
                    if (liveSelectedStudent === stu.id) cls += ' selected';
                    studentButtons +=
                        `<div class="${cls}" onclick="liveSelectStudent('${stu.id}')">${stu.fullName}</div>`;
                });

                // Category buttons
                const cats = ['Mathematics', 'Science', 'English', 'History', 'General Knowledge'];
                let catButtons = cats.map(c =>
                    `<button class="cat-btn ${c===liveCategory?'active':''}" onclick="liveSetCategory('${c}')">${c}</button>`
                ).join('');

                // Stats summary for this game
                let statsHtml = `<div class="table-wrap"><table><tr><th>Student</th><th>Math</th><th>Sci</th><th>Eng</th><th>Hist</th><th>GK</th><th>Total</th></tr>`;
                allStu.forEach(stu => {
                    const s = API.calcStudentStats(liveAnswers, stu.id);
                    statsHtml +=
                        `<tr><td>${stu.fullName}</td><td>${s.Mathematics||0}</td><td>${s.Science||0}</td><td>${s.English||0}</td><td>${s.History||0}</td><td>${s['General Knowledge']||0}</td><td>${s.total}</td></tr>`;
                });
                statsHtml += `</table></div>`;

                const html = `
                    <div class="card">
                        <div class="live-header">
                            <span>⚡ ${liveGame.gameNumber} · ${liveGame.division}</span>
                            <span>${schA?schA.name:'?'} vs ${schB?schB.name:'?'}</span>
                            <span class="question-badge">Q${liveQuestionNumber+1} · ${liveCategory}</span>
                            <span>Half ${liveHalf}</span>
                        </div>
                        <div class="category-row">${catButtons}</div>
                        <div><strong>Select student who answered:</strong></div>
                        <div class="student-grid">${studentButtons}</div>
                        <div class="flex">
                            <button class="btn btn-success" onclick="liveRecord('Correct')">✔ Correct</button>
                            <button class="btn btn-danger" onclick="liveRecord('Wrong')">✘ Wrong</button>
                            <button class="btn btn-outline" onclick="liveNextQuestion()">Next Q →</button>
                            <button class="btn btn-outline" onclick="liveEndHalf()">⏹ End Half</button>
                            <button class="btn btn-outline" onclick="liveEndGame()">🏁 End Game</button>
                        </div>
                        <div class="mt-12">${statsHtml}</div>
                        <div class="mt-12"><button class="btn btn-sm" onclick="liveSaveAndExit()">💾 Save & Exit</button></div>
                    </div>
                `;
                document.getElementById('pageContent').innerHTML = html;
            }

            window.liveSetCategory = function(cat) {
                liveCategory = cat;
                renderLive();
            };

            window.liveSelectStudent = function(studentId) {
                liveSelectedStudent = studentId;
                renderLive();
            };

            window.liveRecord = async function(result) {
                if (!liveSelectedStudent) { toast('Select a student first'); return; }
                // Check if already answered this question
                const existing = liveAnswers.find(a =>
                    a.half === liveHalf &&
                    a.questionNumber === liveQuestionNumber &&
                    a.category === liveCategory
                );
                if (existing) {
                    // Update
                    existing.studentId = liveSelectedStudent;
                    existing.result = result;
                    existing.timestamp = new Date().toISOString();
                    await API.recordAnswer(existing);
                    toast('Updated answer');
                } else {
                    const record = {
                        competitionId: liveGame.competition,
                        division: liveGame.division,
                        gameId: liveGame.id,
                        half: liveHalf,
                        questionNumber: liveQuestionNumber,
                        category: liveCategory,
                        studentId: liveSelectedStudent,
                        schoolId: liveSelectedStudent.startsWith('MMLI') ? liveGame.schoolA : liveGame.schoolA, // simplified
                        result: result,
                    };
                    // get school from student
                    const students = await API.getStudents();
                    const stu = students.find(s => s.id === liveSelectedStudent);
                    if (stu) record.schoolId = stu.school;
                    await API.recordAnswer(record);
                    liveAnswers.push(record);
                    toast('Recorded');
                }
                liveSelectedStudent = null;
                liveQuestionNumber++;
                renderLive();
            };

            window.liveNextQuestion = function() {
                liveSelectedStudent = null;
                liveQuestionNumber++;
                renderLive();
            };

            window.liveEndHalf = function() {
                if (!confirm('End Half ' + liveHalf + '?')) return;
                if (liveHalf === 1) {
                    liveHalf = 2;
                    liveQuestionNumber = 0;
                } else {
                    toast('Game already in second half');
                }
                liveSelectedStudent = null;
                renderLive();
            };

            window.liveEndGame = function() {

                // update game status

                game.status = 'Completed';
                API.updateGame(game);

                    answerRecords: await API.getAnswers(),
                };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `MMLI_Backup_${new Date().toISOString().slice(0,10)}.json`;
                a.click();
                URL.revokeObjectURL(url);
                toast('Backup exported');
            };

            window.importBackup = async function(event) {
                const file = event.target.files[0];
                if (!file) return;
                try {
                    const text = await file.text();
                    const data = JSON.parse(text);
                    if (!data.schemaVersion) { toast('Invalid backup file'); return; }
                    if (!confirm('Import will replace all current data. Continue?')) return;
                    // Clear existing data
                    const stores = ['competitions', 'schools', 'students', 'games', 'answerRecords'];
                    for (let s of stores) {
                        const all = await storeGetAll(s);
                        for (let item of all) await storeDelete(s, item.id);
                    }
                    // Import
                    for (let c of data.competitions || []) await storePut('competitions', c);
                    for (let s of data.schools || []) await storePut('schools', s);
                    for (let s of data.students || []) await storePut('students', s);
                    for (let g of data.games || []) await storePut('games', g);
                    for (let a of data.answerRecords || []) await storePut('answerRecords', a);
                    toast('Import successful!');
                    await API.loadSettings();
                    nav.go('dashboard');
                } catch (e) {
                    toast('Import error: ' + e.message);
                }
                event.target.value = '';
            };

            // --- Init ---
            window.API = API;
            window.nav = nav;

            document.addEventListener('DOMContentLoaded', async () => {
                await API.init();
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        nav.go(btn.dataset.section);
                    });
                });
                nav.go('dashboard');
                toast('MMLI System ready');
            });

            // Expose for inline onclick
            window.setDivision = setDivision;
            window.startLiveGame = startLiveGame;
        })();
    </script>
</body>
</html>
