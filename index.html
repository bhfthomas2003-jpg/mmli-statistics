    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 10% 0%,rgba(243,189,61,.09),transparent 28%),radial-gradient(circle at 100% 10%,rgba(103,167,255,.10),transparent 30%),var(--navy);background-size:200% 200%;animation:bgDrift 26s ease-in-out infinite;color:var(--white);min-height:100vh}
    @keyframes bgDrift{0%,100%{background-position:0% 0%}50%{background-position:30% 20%}}
    ::selection{background:rgba(243,189,61,.35);color:#fff}
    .splash{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at 50% 30%,#0d2d5c,var(--navy) 68%);transition:opacity .55s ease,visibility .55s ease}
    .splash.hide{opacity:0;visibility:hidden;pointer-events:none}
    .splash-glow{position:absolute;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(243,189,61,.24),transparent 70%);filter:blur(6px);animation:splashPulse 2.6s ease-in-out infinite}
    .splash-logo{position:relative;width:104px;height:104px;border-radius:26px;background:#fff;padding:8px;object-fit:contain;box-shadow:0 0 0 1px rgba(243,189,61,.35),0 20px 50px rgba(0,0,0,.4);animation:splashFloat 2.6s ease-in-out infinite}
    .splash-name{position:relative;font-weight:950;letter-spacing:.12em;font-size:1.02rem;margin-top:4px;animation:fadeUp .7s ease .1s both}
    .splash-sub{position:relative;color:var(--gold2);font-size:.7rem;letter-spacing:.24em;font-weight:800;animation:fadeUp .7s ease .2s both}
    .splash-bar{position:relative;width:180px;height:4px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden;margin-top:6px}
    .splash-bar span{display:block;height:100%;width:40%;border-radius:inherit;background:linear-gradient(90deg,var(--gold),var(--gold2));animation:splashBar 1.1s ease-in-out infinite}
    @keyframes splashPulse{0%,100%{transform:scale(1);opacity:.75}50%{transform:scale(1.12);opacity:1}}
    @keyframes splashFloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(1deg)}}
    @keyframes splashBar{0%{transform:translateX(-120%)}100%{transform:translateX(340%)}}
    .brand-logo-wrap{position:relative;display:inline-flex;border-radius:18px}
    .brand-logo-wrap:after{content:"";position:absolute;inset:-3px;border-radius:21px;background:conic-gradient(from 0deg,var(--gold),var(--green),var(--blue),var(--gold));opacity:0;filter:blur(6px);transition:opacity .35s;z-index:-1;animation:spin 4s linear infinite}
    .brand-logo-wrap:hover:after{opacity:.55}
    @keyframes spin{to{transform:rotate(360deg)}}
    button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{min-height:100vh}.shell{max-width:1480px;margin:auto;padding:18px 18px 48px}
    .topbar{position:sticky;top:12px;z-index:50;display:flex;align-items:center;gap:16px;padding:12px 14px;border:1px solid var(--line);border-radius:28px;background:rgba(7,27,58,.82);backdrop-filter:blur(18px);box-shadow:var(--shadow);animation:floatIn .55s ease both;transition:box-shadow .3s,background .3s}
    .topbar.scrolled{background:rgba(6,21,45,.94);box-shadow:0 22px 55px rgba(0,0,0,.4)}

<script>
'use strict';
const APP_VERSION='2.0.0';
const DB_NAME='MMLI_Competition_Statistics';
const DB_VERSION=2;
const DIVISIONS=['Junior High','Senior High'];
const CATEGORIES=['English','Science','History','Mathematics','General Knowledge'];
const AWARD_CATEGORIES=['English','Science','History','Mathematics'];
const STORE_NAMES=['competitions','schools','students','games','answerRecords','settings'];
let db=null;
let state={section:'dashboard',competitionId:null,division:'Junior High',liveGameId:null,search:'',modal:null};
const $=id=>document.getElementById(id);
const uid=(prefix='id')=>prefix+'_'+crypto.randomUUID();
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const now=()=>new Date().toISOString();
const fmtDate=v=>v?new Date(v).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}):'—';
const fmtDateTime=v=>v?new Date(v).toLocaleString(undefined,{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
const toast=(message,type='info')=>{const el=document.createElement('div');el.className='toast-pop';el.textContent=message;el.style.cssText=`position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:300;padding:12px 17px;border-radius:999px;background:${type==='error'?'#8e2d36':type==='success'?'#176b4b':'#12345f'};border:1px solid rgba(255,255,255,.15);box-shadow:0 14px 35px rgba(0,0,0,.35);font-weight:850;max-width:90%;text-align:center`;document.body.appendChild(el);setTimeout(()=>{el.style.opacity='0';el.style.transition='.25s';setTimeout(()=>el.remove(),260)},2600)};
function animateCounters(){document.querySelectorAll('.stat-value').forEach(el=>{const target=parseFloat(el.textContent.replace(/[^\d.-]/g,''));if(isNaN(target)||el.dataset.animated==='1')return;const suffix=el.textContent.replace(/^[\d.,\s-]+/,'');el.dataset.animated='1';const dur=650,start=performance.now(),isInt=Number.isInteger(target);function step(t){const p=Math.min(1,(t-start)/dur);const eased=1-Math.pow(1-p,3);const val=target*eased;el.textContent=(isInt?Math.round(val):(Math.round(val*10)/10))+suffix;if(p<1)requestAnimationFrame(step)}requestAnimationFrame(step)})}
function confirmBox(message){return window.confirm(message)}
function openDB(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window))return reject(new Error('IndexedDB is not supported by this browser.'));const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=e=>{const d=e.target.result;for(const s of STORE_NAMES){if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:s==='settings'?'key':'id'})}const a=e.target.transaction.objectStore('answerRecords');[['competitionId','competitionId'],['gameId','gameId'],['studentId','studentId'],['schoolId','schoolId'],['division','division']].forEach(([n,p])=>{if(!a.indexNames.contains(n))a.createIndex(n,p,{unique:false})});const g=e.target.transaction.objectStore('games');[['competitionId','competitionId'],['division','division']].forEach(([n,p])=>{if(!g.indexNames.contains(n))g.createIndex(n,p,{unique:false})});const st=e.target.transaction.objectStore('students');[['schoolId','schoolId'],['division','division']].forEach(([n,p])=>{if(!st.indexNames.contains(n))st.createIndex(n,p,{unique:false})});};req.onsuccess=()=>{db=req.result;db.onversionchange=()=>db.close();resolve(db)};req.onerror=()=>reject(req.error)} )}
function tx(store,mode='readonly'){return db.transaction(store,mode).objectStore(store)}
function getAll(store){return new Promise((res,rej)=>{const r=tx(store).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function getOne(store,key){return new Promise((res,rej)=>{const r=tx(store).get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function put(store,obj){return new Promise((res,rej)=>{const t=db.transaction(store,'readwrite');const r=t.objectStore(store).put(obj);t.oncomplete=()=>res(obj);t.onerror=()=>rej(t.error||r.error);t.onabort=()=>rej(t.error||new Error('Database transaction aborted'))})}
function del(store,key){return new Promise((res,rej)=>{const t=db.transaction(store,'readwrite');t.objectStore(store).delete(key);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('Database transaction aborted'))})}
async function bulkReplace(snapshot){return new Promise((resolve,reject)=>{const t=db.transaction(STORE_NAMES,'readwrite');for(const s of STORE_NAMES){const os=t.objectStore(s);os.clear();for(const item of (snapshot[s]||[]))os.put(item)}t.oncomplete=resolve;t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error||new Error('Import transaction aborted'))})}

function calcStudentStats(records,studentId){const rs=records.filter(a=>a.studentId===studentId);const out={total:rs.length,correct:0,wrong:0,accuracy:0};for(const c of CATEGORIES)out[c]=0;for(const r of rs){if(r.result==='Correct')out.correct++;else if(r.result==='Wrong')out.wrong++;if(Object.hasOwn(out,r.category))out[r.category]++}out.accuracy=out.total?Math.round(out.correct/out.total*1000)/10:0;return out}
function calcSchoolStats(records,schoolId){const rs=records.filter(a=>a.schoolId===schoolId);const correct=rs.filter(a=>a.result==='Correct').length;return {total:rs.length,correct,wrong:rs.filter(a=>a.result==='Wrong').length,accuracy:rs.length?Math.round(correct/rs.length*1000)/10:0,...Object.fromEntries(CATEGORIES.map(c=>[c,rs.filter(a=>a.category===c).length]))}}
function answerKey(gameId,half,q){return `${gameId}|${half}|${q}`}
async function findAnswer(gameId,half,q){const rs=await answersForGame(gameId);return rs.find(a=>a.half===half&&a.questionNumber===q)||null}
async function gameRoster(game){const st=await students();const rosterA=(game.rosterA||[]).map(id=>st.find(x=>x.id===id)).filter(Boolean);const rosterB=(game.rosterB||[]).map(id=>st.find(x=>x.id===id)).filter(Boolean);return {A:rosterA,B:rosterB,all:[...rosterA,...rosterB]}}

}

ded</div></div></div><div class="grid grid-2 cards"><div class="card">${header('Active Competition',active?active.name:'No competition selected',`<button class="btn btn-sm btn-primary" onclick="go('competitions')">Change</button>`)}${active?`<div class="notice"><strong>${esc(active.name)}</strong><br><span class="muted">${esc(active.year||'')} · ${esc(active.venue||'')} · ${esc(active.status||'Draft')}</span></div>`:`<div class="empty"><div class="big">🏆</div><p>Create a competition to begin.</p></div>`}</div><div class="card">${header('Division',`Statistics and awards are always separated by division`)}<div class="hero-actions"><button class="btn ${state.division==='Junior High'?'btn-primary':'btn-ghost'}" onclick="setDivision('Junior High')">Junior High</button><button class="btn ${state.division==='Senior High'?'btn-primary':'btn-ghost'}" onclick="setDivision('Senior High')">Senior High</button></div></div></div><div class="card cards">${header('Recent Games','Latest activity in the selected competition')}${recent.length?`<div class="table-wrap"><table><thead><tr><th>Game</th><th>Division</th><th>Match</th><th>Status</th><th>Updated</th></tr></thead><tbody>${recent.map(g=>`<tr><td><strong>Game ${g.gameNumber}</strong></td><td>${esc(g.division)}</td><td>${esc(g.schoolAName||'School A')} <strong>vs</strong> ${esc(g.schoolBName||'School B')}</td><td><span class="badge ${g.status==='Completed'||g.status==='Locked'?'green':'gold'}">${esc(g.status)}</span></td><td>${fmtDateTime(g.updatedAt||g.createdAt)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><div class="big">🎮</div><p>No games yet.</p></div>`}</div>`}

async function saveStudent(id){const fullName=$('stName').value.trim(),schoolId=$('stSchool').value,division=$('stDiv').value;if(!fullName||!schoolId)return toast('Name and school are required','error');const e=id?await getOne('students',id):null;const existingAnswers=await answers();if(e&&existingAnswers.some(a=>a.studentId===id)&&(e.schoolId!==schoolId||e.division!==division))return toast('This student already has competition history. School and division cannot be changed because it would corrupt historical statistics.','error');let newId=id;if(!newId){const all=await students();const nums=all.map(s=>String(s.id||'').match(/^MMLI-STU-(\d+)$/)).filter(Boolean).map(m=>Number(m[1]));const next=(nums.length?Math.max(...nums):0)+1;newId=`MMLI-STU-${String(next).padStart(6,'0')}`}const data={id:newId,fullName,schoolId,division,grade:$('stGrade').value.trim(),registrationYear:$('stYear').value.trim(),createdAt:e?.createdAt||now(),updatedAt:now()};await put('students',data);closeModal();toast('Student saved','success');renderStudents()}window.saveStudent=saveStudent;

async function renderGames(){const [gs,ss,comps]=await Promise.all([games(),schools(),getAll('competitions')]);const active=state.competitionId;const rows=gs.filter(g=>g.competitionId===active);$('content').innerHTML=`<div class="card">${header('Games','2 schools per game, with 1–6 students per school (maximum 6).',`<button class="btn btn-primary" onclick="newGame()">+ New Game</button>`)}${!active?`<div class="notice danger-note">Select a competition first.</div>`:rows.length?`<div class="table-wrap"><table><thead><tr><th>Game</th><th>Division</th><th>School A</th><th>School B</th><th>Half Status</th><th>Game Status</th><th>Actions</th></tr></thead><tbody>${rows.sort((a,b)=>(a.gameNumber||0)-(b.gameNumber||0)).map(g=>`<tr><td><strong>Game ${g.gameNumber}</strong></td><td>${esc(g.division)}</td><td>${esc(g.schoolAName)}</td><td>${esc(g.schoolBName)}</td><td><span class="badge">1st: ${esc(g.firstHalfStatus)}</span> <span class="badge">2nd: ${esc(g.secondHalfStatus)}</span></td><td><span class="badge ${g.status==='Completed'||g.status==='Locked'?'green':'gold'}">${esc(g.status)}</span></td><td><div class="toolbar-actions">${g.status!=='Completed'&&g.status!=='Locked'?`<button class="btn btn-sm btn-success" onclick="startLive('${g.id}')">▶ Live</button>`:''}<button class="btn btn-sm btn-ghost" onclick="editGame('${g.id}')">Edit</button><button class="btn btn-sm btn-danger" onclick="removeGame('${g.id}')">Delete</button></div></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><div class="big">🎮</div><p>No games in this competition.</p></div>`}</div>`}

async function showGame(id){if(!state.competitionId)return toast('Select a competition first','error');const [e,ss,st]=await Promise.all([id?getOne('games',id):null,schools(),students()]);const div=e?.division||state.division;const eligibleSchools=ss.filter(s=>s.schoolType==='Both'||s.schoolType===div);modal(e?'Edit Game':'Create Game',`<div class="form-grid"><div class="field"><label>Game number *</label><input id="gNum" type="number" min="1" class="input" value="${esc(e?.gameNumber||'')}"></div><div class="field"><label>Division *</label><select id="gDiv" class="select"><option>Junior High</option><option>Senior High</option></select></div><div class="field"><label>School A *</label><select id="gA" class="select"><option value="">Select school</option>${eligibleSchools.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>School B *</label><select id="gB" class="select"><option value="">Select school</option>${eligibleSchools.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div></div><div id="rosterHelp" class="notice">Choose the two schools, then select up to 6 students for each school (at least 1 required).</div><div class="grid grid-2"><div><h3>School A Roster</h3><div id="rosterA"></div></div><div><h3>School B Roster</h3><div id="rosterB"></div></div></div>`,`<div class="hero-actions"><button class="btn btn-primary" onclick="saveGame('${id||''}')">Save Game</button><button class="btn btn-ghost" onclick="closeModal()">Cancel</button></div>`);if(e){$('gNum').value=e.gameNumber;$('gDiv').value=e.division;$('gA').value=e.schoolAId;$('gB').value=e.schoolBId}const update=async()=>{const divv=$('gDiv').value,a=$('gA').value,b=$('gB').value;const listA=st.filter(x=>x.schoolId===a&&x.division===divv),listB=st.filter(x=>x.schoolId===b&&x.division===divv);renderRoster('rosterA',listA,e?.rosterA||[],'ra');renderRoster('rosterB',listB,e?.rosterB||[],'rb');$('rosterHelp').innerHTML=(a&&b&&a== function renderRoster(id,list,selected,prefix){$(id).innerHTML=list.length?`<div class="roster-count" id="${prefix}Count"></div><div style="display:grid;gap:7px">${list.map((s,i)=>`<label style="display:flex;align-items:center;gap:9px;padding:9px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.03);cursor:pointer"><input type="checkbox" name="${prefix}" value="${s.id}" ${selected.includes(s.id)?'checked':''}> <span><strong>${i+1}. ${esc(s.fullName)}</strong><br><small class="muted">${esc(s.id)}</small></span></label>`).join('')}</div>`:`<div class="empty" style="padding:18px">No eligible students registered.</div>`;updateRosterCount(prefix);document.querySelectorAll(`input[name="${prefix}"]`).forEach(cb=>cb.addEventListener('change',()=>updateRosterCount(prefix)))}
function updateRosterCount(prefix){const boxes=[...document.querySelectorAll(`input[name="${prefix}"]`)];const checked=boxes.filter(b=>b.checked);const el=$(`${prefix}Count`);if(el)el.innerHTML=`<span class="badge ${checked.length===6?'green':checked.length>0?'gold':''}">${checked.length} / 6 selected</span>`;boxes.forEach(b=>{if(!b.checked)b.disabled=checked.length>=6})}
async function saveGame(id){const num=Number($('gNum').value),division=$('gDiv').value,a=$('gA').value,b=$('gB').value,ra=[...document.querySelectorAll('input[name="ra"]:checked')].map(x=>x.value),rb=[...document.querySelectorAll('input[name="rb"]:checked')].map(x=>x.value);if(!Number.isInteger(num)||num<1)return toast('Enter a valid game number','error');if(!a||!b||a===b)return toast('Select two different schools','error');if(ra.length<1||ra.length>6||rb.length<1||rb.length>6)return toast(`Each school needs between 1 and 6 students selected (maximum 6). You selected ${ra.length} and ${rb.length}.`,'error');const st=await students();const ids=[...ra,...rb];if(new Set(ids).size!==ra.length+rb.length)return toast('A student cannot appear twice in the same game.','error');if(ids.some(x=>{const s=st.find(y=>y.id===x);return !s||s.division!==division}))return toast('Every roster student must belong to the selected division.','error');const all=await games();const duplicate=all.find(g=>g.competitionId===state.competitionId&&g.division===division&&g.gameNumber===num&&g.id!==id);if(duplicate)return toast('That game number already exists in this division.','error');const sa=await getOne('schools',a),sb=await getOne('schools',b),existing=id?await getOne('games',id):null;if(existing&&existing.status==='Completed')return toast('Completed games are locked from roster changes.','error');if(existing){const prior=await answersForGame(existing.id);if(prior.length&&(existing.division!==division||existing.schoolAId!==a||existing.schoolBId!==b||JSON.stringify(existing.rosterA||[])!==JSON.stringify(ra)||JSON.stringify(existing.rosterB||[])!==JSON.stringify(rb)))return toast('This game already has answer records. Division, schools, and rosters cannot be changed after recording begins.','error')}const data={id:id||uid('game'),competitionId:state.competitionId,division,gameNumber:num,schoolAId:a,schoolBId:b,schoolAName:sa.name,schoolBName:sb.name,rosterA:ra,rosterB:rb,status:existing?.status||'Scheduled',firstHalfStatus:existing?.firstHalfStatus||'Not Started',secondHalfStatus:existing?.secondHalfStatus||'Not Started',currentHalf:existing?.currentHalf||1,currentQuestion:existing?.currentQuestion||1,createdAt:existing?.createdAt||now(),updatedAt:now()};await put('games',data);closeModal();toast('Game saved','success');renderGames()}window.saveGame=saveGame;
async function removeGame(id){const g=await getOne('games',id);if(!g)return;if(g.status==='Completed'||g.status==='Locked')return toast('Completed games cannot be deleted from the normal workflow. Export a backup and use an administrator recovery process if necessary.','error');if(!confirmBox('Delete this game and its answer records?'))return;for(const a of await answersForGame(id))await del('answerRecords',a.id);await del('games',id);toast('Game deleted','success');renderGames()}window.removeGame=removeGame;
async function startLive(id){const g=await getOne('games',id);if(!g)return;if(g.status==='Completed'||g.status==='Locked')return toast('This game is completed and locked.','error');state.liveGameId=id;state.section='live';if(g.status==='Scheduled')g.status='First Half';g.currentHalf=g.currentHalf||1;g.currentQuestion=g.currentQuestion||1;g.firstHalfStatus=g.currentHalf===1?'In Progress':g.firstHalfStatus;g.secondHalfStatus=g.currentHalf===2?'In Progress':g.secondHalfStatus;g.updatedAt=now();await put('games',g);render()}window.startLive=startLive;

async function renderLive(){if(!state.liveGameId){$('content').innerHTML=`<div class="card">${header('Live Game','Select a scheduled game from Games to begin.') }<div class="empty"><div class="big">⚡</div><p>No live game selected.</p><button class="btn btn-primary" onclick="go('games')">Open Games</button></div></div>`;return}const [g,roster]=await Promise.all([getOne('games',state.liveGameId),gameRoster(await getOne('games',state.liveGameId))]);if(!g){state.liveGameId=null;return renderLive()}const records=await answersForGame(g.id);const currentHalf=g.currentHalf||1,currentQuestion=g.currentQuestion||1;const currentAnswer=records.find(a=>a.half===currentHalf&&a.questionNumber===currentQuestion);if(currentAnswer)live.selectedStudent=currentAnswer.studentId;const statA=roster.A.map(s=>({s,stats:calcStudentStats(records,s.id)})),statB=roster.B.map(s=>({s,stats:calcStudentStats(records,s.id)}));const studentButtons=(arr,prefix)=>arr.map((x,i)=>{const ans=records.find(a=>a.half===currentHalf&&a.questionNumber===currentQuestion&&a.studentId===x.s.id);let cls='student-btn';if(ans)cls+=' '+ans.result.toLowerCase();if(live.selectedStudent===x.s.id)cls+=' selected';return `<button class="${cls}" onclick="selectLiveStudent('${x.s.id}')"><span class="student-number">${prefix}${i+1}</span>${esc(x.s.fullName)}</button>`}).join('');const statsTable=[...statA,...statB].map(x=>`<tr><td>${esc(x.s.fullName)}</td><td>${x.stats.English}</td><td>${x.stats.Science}</td><td>${x.stats.History}</td><td>${x.stats.Mathematics}</td><td>${x.stats['General Knowledge']}</td><td><strong>${x.stats.total}</strong></td><td>${x.stats.accuracy}%</td></tr>`).join('');$('content').innerHTML=`<div class="live-shell"><div class="live-top"><div class="team-title">${esc(g.schoolAName)}</div><div class="versus">VS</div><div class="team-title right">${esc(g.schoolBName)}</div></div><div class="halfbar"><span class="${currentHalf===1?'active':''}">FIRST HALF</span><span class="${currentHalf===2?'active':''}">S g>${x.stats.total}</strong></td><td>${x.stats.accuracy}%</td></tr>`).join(''):`<tr><td colspan="10" class="empty">No statistics yet.</td></tr>`}</tbody></table></div></div><div class="card"><h3>School Statistics</h3><div class="table-wrap"><table><thead><tr><th>Rank</th><th>School</th><th>Games</th><th>EN</th><th>SCI</th><th>HIST</th><th>MATH</th><th>GK</th><th>Total</th><th>Accuracy</th></tr></thead><tbody>${schoolRows.length?schoolRows.map((x,i)=>`<tr><td class="rank">${i+1}</td><td><strong>${esc(x.s.name)}</strong></td><td>${x.games}</td><td>${x.stats.English}</td><td>${x.stats.Science}</td><td>${x.stats.History}</td><td>${x.stats.Mathematics}</td><td>${x.stats['General Knowledge']}</td><td><strong>${x.stats.total}</strong></td><td>${x.stats.accuracy}%</td></tr>`).join(''):`<tr><td colspan="10" class="empty">No school statistics yet.</td></tr>`}</tbody></table></div></div></div></div>`}
function awardData(records,studentsList,division){const div=studentsList.filter(s=>s.division===division);const out={};for(const cat of AWARD_CATEGORIES){const ranked=div.map(s=>({s,stats:calcStudentStats(records,s.id)})).filter(x=>x.stats[cat]>0).sort((a,b)=>b.stats[cat]-a.stats[cat]||b.stats.correct-a.stats.correct);if(!ranked.length){out[cat]=null;continue}const top=ranked[0].stats[cat];out[cat]={metric:top,winners:ranked.filter(x=>x.stats[cat]===top)}}const ranked=div.map(s=>({s,stats:calcStudentStats(records,s.id)})).filter(x=>x.stats.total>0).sort((a,b)=>b.stats.total-a.stats.total||b.stats.correct-a.stats.correct);out.MVQ=ranked.length?{metric:ranked[0].stats.total,winners:ranked.filter(x=>x.stats.total===ranked[0].stats.total)}:null;return out}
async function renderAwards(){if(!state.competitionId)return $('content').innerHTML=`<div class="card"><div class="empty"><div class="big">🏅</div><p>Select a competition first.</p></div></div>`;const [as,st,ss]=await Promise.all([answersForCompetition(state.competitionId),students(),schools()]);const cards=[];for(const div of DIVISIONS){const awards=awardData(as.filter(a=>a.division===div),st,div);cards.push(`<div class="card">${header(`${div} Awards`,`Calculated from the complete competition record.`)}<div class="grid grid-2">${[...AWARD_CATEGORIES.map(c=>[c,`Best ${c} Quizzer`]),['MVQ','Most Valuable Quizzer']].map(([key,label])=>{const a=awards[key];if(!a)return `<div class="award"><div class="award-icon">🏅</div><h3>${label}</h3><div class="winner muted">No qualifying record yet</div></div>`;const names=a.winners.map(x=>{const school=ss.find(s=>s.id===x.s.schoolId);return `<div>${esc(x.s.fullName)} <span class="muted">· ${esc(school?.name||'')}</span></div>`}).join('');return `<div class="award"><div class="award-icon">${key==='MVQ'?'👑':'🏆'}</div><h3>${label}</h3><div class="winner ${a.winners.length>1?'tie':''}">${names}</div><div class="metric">${a.metric} questions answered${a.winners.length>1?' · TIE':''}</div></div>`}).join('')}</div></div>`)}$('content').innerHTML=`<div>${cards.join('')}</div><div class="card cards"><div class="notice">Award rule: category awards and MVQ are based on <strong>questions answered</strong>, not questions correct. Accuracy is additional information only. Ties are shown rather than silently broken.</div></div>`}
async function renderBackup(){const comps=await getAll('competitions'),ss=await schools(),st=await students(),gs=await games(),as=await answers(),last=await setting('lastBackup',null);$('content').innerHTML=`<div class="grid grid-2"><div class="card">${header('Backup & Restore','Protect the entire offline competition database.') }<div class="hero-actions"><button class="btn btn-primary" onclick="exportDatabase()">📤 Export Complete Database</button><button class="btn btn-ghost" onclick="document.getElementById('importDb').click()">📥 Restore Database</button><input id="importDb" type="file" accept="application/json,.json" hidden></div><div class="notice" style="margin-top:14px"><strong>Last backup:</strong> ${last?fmtDateTime(last):'Never'}<br><span class="muted">Export regularly, especially after completed games.</span></div></div><div class="card">${header('Database Summary')}<div class="grid grid-2"><div><div class="stat-value">${comps.length}</div><div class="stat-label">Competitions</div></div><div><div class="stat-value">${ss.length}</div><div class="stat-label">Schools</div></div><div><div class="stat-value">${st.length}</div><div class="stat-label">Students</div></div><div><div class="stat-value">${gs.length}</div><div class="stat-label">Games</div></div><div><div class="stat-value">${as.length}</div><div class="stat-label">Answer Records</div></div></div></div></div><div class="card cards">${header('Website Export','Prepare approved competition data for a future MMLI online statistics portal.',`<button class="btn btn-primary" onclick="exportWebsiteData()">🌐 Export Website Data</button>`)}<div class="notice">Version 1 is intentionally offline. This export is structured so a future website/database connector can consume the data without changing the competition recording logic.</div></div><div class="card cards danger-zone">${header('Danger Zone','Permanently erase every competition, school, student, game, and answer record from this device.',`<button class="btn btn-danger" onclick="showFactoryReset()">🗑️ Clear Entire System</button>`)}<div class="notice danger-note">Use this only after a competition is fully finished and archived (export a backup first). This wipes the whole offline database on this device and cannot be undone.</div></div>`;$('importDb').addEventListener('change',e=>importDatabase(e.target.files[0]))}
function showFactoryReset(){modal('⚠️ Erase Entire System',`<div class="notice danger-note"><strong>This permanently deletes every competition, school, student, game, and answer record on this device.</strong><br>This cannot be undone unless you have a recent exported backup file.</div><div class="field" style="margin-top:14px"><label>Type <strong>RESET</strong> below to confirm</label><input id="resetConfirmInput" class="input" placeholder="Type RESET" autocomplete="off"></div>`,`<div class="hero-actions"><button id="resetConfirmBtn" class="btn btn-danger" disabled onclick="factoryReset()">🗑️ Erase Everything</button><button class="btn btn-ghost" onclick="closeModal()">Cancel</button></div>`);const input=$('resetConfirmInput'),btn=$('resetConfirmBtn');input.addEventListener('input',()=>{btn.disabled=input.value.trim().toUpperCase()!=='RESET'});input.focus()}window.showFactoryReset=showFactoryReset;
async function factoryReset(){await bulkReplace({});state={section:'dashboard',competitionId:null,division:'Junior High',liveGameId:null,search:'',modal:null};closeModal();toast('All data erased. Starting fresh.','success');await render()}window.factoryReset=factoryReset;
async function exportDatabase(){const data=await allData();const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});downloadBlob(blob,`MMLI_Competition_Database_${new Date().toISOString().slice(0,10)}.json`);await setSetting('lastBackup',now());toast('Complete database backup exported','success');renderBackup()}
async function exportWebsiteData(){const data=await allData();const comps=await getAll('competitions'),ss=await schools(),st=await students(),gs=await games(),as=await answers();data.publicExport={generatedAt:now(),competitions:comps.map(c=>({...c,publicStatus:c.status==='Finalized'?'Approved':'Draft'})),schools:ss,students:st,games:gs.filter(g=>g.status==='Completed'||g.status==='Locked'),answerRecords:as.filter(a=>gs.some(g=>g.id===a.gameId&&(g.status==='Completed'||g.status==='Locked')))};delete data.settings;downloadBlob(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),`MMLI_Website_Statistics_${new Date().toISOString().slice(0,10)}.json`);toast('Website-ready export created','success')}
function downloadBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),500)}
async function importDatabase(file){if(!file)return;try{const data=JSON.parse(await file.text());if(!data||data.schemaVersion!==2||!Array.isArray(data.competitions)||!Array.isArray(data.answerRecords))throw new Error('Unsupported or invalid MMLI backup.');if(!confirmBox('RESTORE will replace all local MMLI data on this device. Continue?'))return;await bulkReplace(data);await ensureState();toast('Database restored successfully','success');state.section='dashboard';render()}catch(e){console.error(e);toast('Restore failed: '+e.message,'error')}}
window.exportDatabase=exportDatabase;window.exportWebsiteData=exportWebsiteData;
function hideSplash(){const s=$('splash');if(!s)return;s.classList.add('hide');setTimeout(()=>s.remove(),650)}
const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if(!reduceMotion&&window.matchMedia('(pointer:fine)').matches){document.addEventListener('mousemove',e=>{const el=document.getElementById('deviceTilt');if(!el)return;const r=el.parentElement.getBoundingClientRect();if(e.clientX<r.left-140||e.clientX>r.right+140||e.clientY<r.top-140||e.clientY>r.bottom+140)return;const px=(e.clientX-(r.left+r.width/2))/r.width,py=(e.clientY-(r.top+r.height/2))/r.height;el.style.setProperty('--mx',(-py*10).toFixed(2)+'deg');el.style.setProperty('--my',(px*14).toFixed(2)+'deg')})}
window.addEventListener('scroll',()=>{const tb=document.querySelector('.topbar');if(!tb)return;tb.classList.toggle('scrolled',window.scrollY>4)},{passive:true});
async function boot(){const splashStart=performance.now();try{await openDB();await ensureState();$('connectionText').textContent=navigator.onLine?'OFFLINE-READY · ONLINE AVAILABLE':'OFFLINE MODE';window.addEventListener('online',()=>{$('connectionText').textContent='OFFLINE-READY · ONLINE AVAILABLE'});window.addEventListener('offline',()=>{$('connectionText').textContent='OFFLINE MODE'});if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./service-worker.js').catch(console.warn);await render();}catch(e){$('content').innerHTML=`<div class="card"><h2>Database initialization failed</h2><div class="notice danger-note">${esc(e.message)}</div><p class="muted">Use a modern browser with IndexedDB enabled. Do not use private/incognito mode for official competition records.</p></div>`}const elapsed=performance.now()-splashStart;setTimeout(hideSplash,Math.max(0,550-elapsed))}
boot();
</script>
