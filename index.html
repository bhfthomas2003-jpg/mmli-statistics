<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071b3a">
  <meta name="description" content="MMLI Offline Competition Statistics & Awards System">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./assets/mmli-logo.jpeg" type="image/jpeg">
  <title>MMLI Competition Statistics</title>
  <style>
    :root{
      --navy:#071b3a;--navy2:#0d2d5c;--navy3:#123b72;--gold:#f3bd3d;--gold2:#ffd970;
      --ink:#08152c;--muted:#8fa6c9;--white:#f7faff;--line:rgba(255,255,255,.09);
      --green:#43c98b;--red:#ef6b72;--blue:#67a7ff;--card:rgba(15,43,85,.86);
      --shadow:0 18px 60px rgba(0,0,0,.28);--radius:24px;
    }
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 10% 0%,rgba(243,189,61,.09),transparent 28%),radial-gradient(circle at 100% 10%,rgba(103,167,255,.10),transparent 30%),var(--navy);color:var(--white);min-height:100vh}
    button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{min-height:100vh}.shell{max-width:1480px;margin:auto;padding:18px 18px 48px}
    .topbar{position:sticky;top:12px;z-index:50;display:flex;align-items:center;gap:16px;padding:12px 14px;border:1px solid var(--line);border-radius:28px;background:rgba(7,27,58,.82);backdrop-filter:blur(18px);box-shadow:var(--shadow);animation:floatIn .55s ease both}
    .brand{display:flex;align-items:center;gap:12px;min-width:250px}.brand-logo{width:58px;height:58px;border-radius:18px;object-fit:cover;background:#fff;padding:3px;box-shadow:0 0 0 1px rgba(243,189,61,.28),0 8px 25px rgba(0,0,0,.24);animation:logoFloat 5s ease-in-out infinite}.brand-name{font-weight:900;letter-spacing:.04em;font-size:1.08rem}.brand-sub{font-size:.72rem;color:var(--gold2);letter-spacing:.15em;margin-top:2px}
    .offline-pill{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid rgba(67,201,139,.35);background:rgba(67,201,139,.09);color:#b8f5d8;padding:9px 13px;border-radius:999px;font-weight:800;font-size:.78rem}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 5px rgba(67,201,139,.12)}
    .nav{display:flex;gap:6px;overflow:auto;padding:10px 2px 4px;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav button{border:1px solid transparent;background:transparent;color:#afc3e2;padding:10px 13px;border-radius:14px;white-space:nowrap;font-weight:750;transition:.2s}.nav button:hover{background:rgba(255,255,255,.05);color:#fff}.nav button.active{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--ink);box-shadow:0 8px 22px rgba(243,189,61,.16)}
    .page{animation:fadeUp .35s ease both}.hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:32px;padding:28px;background:linear-gradient(135deg,rgba(18,59,114,.88),rgba(8,29,62,.92));box-shadow:var(--shadow);margin-top:12px}.hero:after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;right:-110px;top:-130px;background:radial-gradient(circle,rgba(243,189,61,.22),transparent 65%);pointer-events:none}.eyebrow{color:var(--gold2);font-size:.72rem;font-weight:900;letter-spacing:.17em;text-transform:uppercase}.hero h1{font-size:clamp(1.7rem,4vw,3.1rem);line-height:1.05;margin:9px 0}.hero p{max-width:760px;color:#c3d1e7;margin:0;line-height:1.65}.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
    .grid{display:grid;gap:16px}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}.cards{margin-top:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);animation:fadeUp .35s ease both}.card h2,.card h3{margin:0 0 10px}.muted{color:var(--muted)}
    .stat-card{position:relative;overflow:hidden;min-height:126px}.stat-card:before{content:"";position:absolute;right:-40px;bottom:-50px;width:130px;height:130px;border-radius:50%;background:rgba(243,189,61,.08)}.stat-icon{font-size:1.25rem}.stat-value{font-size:2.25rem;font-weight:950;color:var(--gold2);margin-top:10px}.stat-label{font-size:.76rem;color:#a7b9d5;text-transform:uppercase;letter-spacing:.08em;font-weight:800}
    .btn{border:0;border-radius:14px;padding:11px 16px;font-weight:850;transition:.18s;box-shadow:0 7px 20px rgba(0,0,0,.16)}.btn:hover{transform:translateY(-1px)}.btn:active{transform:scale(.98)}.btn-primary{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--ink)}.btn-ghost{background:rgba(255,255,255,.05);border:1px solid var(--line);color:#e9f0fb}.btn-success{background:var(--green);color:#06231a}.btn-danger{background:var(--red);color:#fff}.btn-blue{background:var(--blue);color:#06182f}.btn-sm{padding:8px 11px;border-radius:11px;font-size:.82rem}.btn-block{width:100%}
    .toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}.toolbar-actions{display:flex;gap:8px;flex-wrap:wrap}.select,.input,.textarea{width:100%;background:#06182f;color:#f4f7fd;border:1px solid #254978;border-radius:13px;padding:12px 13px;outline:0}.select:focus,.input:focus,.textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(243,189,61,.11)}label{display:block;font-size:.78rem;color:#afc1dd;font-weight:800;margin:0 0 6px}.field{margin-bottom:13px}.help{font-size:.75rem;color:#8ea5c7;margin-top:5px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-grid .full{grid-column:1/-1}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:12px 11px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}th{font-size:.72rem;color:var(--gold2);text-transform:uppercase;letter-spacing:.06em;background:rgba(0,0,0,.12);position:sticky;top:0}td{font-size:.88rem}tr:last-child td{border-bottom:0}.rank{font-weight:950;color:var(--gold2)}.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 9px;font-size:.72rem;font-weight:850;background:rgba(255,255,255,.07);border:1px solid var(--line)}.badge.green{color:#aef1d0;background:rgba(67,201,139,.1)}.badge.gold{color:#ffe9a1;background:rgba(243,189,61,.11)}.badge.red{color:#ffc0c4;background:rgba(239,107,114,.1)}
    .empty{text-align:center;padding:42px 20px;color:#8fa6c9}.empty .big{font-size:2.4rem;margin-bottom:8px}.notice{border-left:4px solid var(--gold);background:rgba(243,189,61,.08);padding:13px 15px;border-radius:12px;color:#e7edf8}.danger-note{border-left-color:var(--red);background:rgba(239,107,114,.08)}
    .modal-backdrop{position:fixed;inset:0;background:rgba(0,7,20,.78);backdrop-filter:blur(8px);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}.modal{width:min(760px,100%);max-height:92vh;overflow:auto;background:#0b254b;border:1px solid rgba(243,189,61,.35);border-radius:26px;box-shadow:0 30px 90px rgba(0,0,0,.55);padding:22px;animation:modalIn .22s ease both}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}.modal-head h2{margin:0}.close{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.05);color:#fff;font-size:1.2rem}
    .live-shell{background:linear-gradient(180deg,#071b3a,#06152d);border:1px solid rgba(243,189,61,.2);border-radius:28px;padding:18px}.live-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}.team-title{font-weight:950;font-size:clamp(1rem,2vw,1.35rem)}.team-title.right{text-align:right}.versus{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--ink);font-weight:950;box-shadow:0 12px 30px rgba(243,189,61,.18)}.halfbar{display:flex;gap:8px;justify-content:center;margin:16px 0}.halfbar span{padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.06);color:#9db4d5;font-size:.76rem;font-weight:900}.halfbar span.active{background:var(--gold);color:var(--ink)}.question-card{text-align:center;padding:22px;border:1px solid var(--line);border-radius:22px;background:rgba(255,255,255,.025)}.qnum{font-size:clamp(2rem,7vw,4.6rem);font-weight:950;line-height:1;color:#fff}.category-pills{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin:16px 0}.cat{border:1px solid #315582;background:#0b2a53;color:#c9d8ed;border-radius:999px;padding:9px 13px;font-weight:850;font-size:.78rem}.cat.active{background:var(--gold);border-color:var(--gold);color:var(--ink)}.student-columns{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}.school-panel{background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:20px;padding:14px}.school-panel h3{margin:0 0 10px;color:var(--gold2)}.student-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.student-btn{min-height:70px;border:1px solid #2a4f7d;border-radius:15px;background:#0d2d58;color:#fff;padding:9px 6px;font-weight:850;font-size:.77rem;transition:.18s}.student-btn:hover{border-color:var(--gold);transform:translateY(-1px)}.student-btn.selected{background:rgba(243,189,61,.18);border-color:var(--gold);box-shadow:0 0 0 3px rgba(243,189,61,.09)}.student-btn.correct{border-color:var(--green);background:rgba(67,201,139,.18)}.student-btn.wrong{border-color:var(--red);background:rgba(239,107,114,.18)}.student-number{display:block;color:var(--gold2);font-size:.68rem;margin-bottom:3px}.live-actions{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:16px}.selected-note{text-align:center;color:#dbe6f5;font-weight:750;margin-top:10px}
    .award{position:relative;text-align:center;padding:24px 16px;border-radius:22px;background:linear-gradient(145deg,rgba(243,189,61,.12),rgba(255,255,255,.025));border:1px solid rgba(243,189,61,.2)}.award-icon{font-size:2.5rem}.award h3{margin:7px 0 4px;color:var(--gold2)}.award .winner{font-size:1.05rem;font-weight:950}.award .metric{color:#a8bbd6;margin-top:4px;font-size:.8rem}.tie{color:#ffd0d2}
    .search{max-width:360px}.footer{text-align:center;color:#738db1;font-size:.74rem;padding:28px 0}.progress{height:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}.progress > span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:inherit}
    @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes floatIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}@keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}@keyframes logoFloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(.5deg)}}
    @media(max-width:980px){.grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(2,minmax(0,1fr))}.brand{min-width:0}.offline-pill{display:none}}
    @media(max-width:700px){.shell{padding:10px 10px 38px}.topbar{top:6px;border-radius:22px;padding:9px}.brand-logo{width:48px;height:48px;border-radius:15px}.brand-name{font-size:.92rem}.brand-sub{font-size:.59rem}.nav{margin:2px -3px 0}.nav button{padding:9px 10px;font-size:.72rem}.grid-2,.grid-3,.grid-4,.form-grid{grid-template-columns:1fr}.hero{padding:22px;border-radius:24px}.card{padding:16px;border-radius:20px}.student-columns{grid-template-columns:1fr}.student-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.live-top{grid-template-columns:1fr auto 1fr}.team-title{font-size:.9rem}.versus{width:50px;height:50px;border-radius:16px}.qnum{font-size:3.2rem}.live-actions .btn{flex:1 1 42%}.toolbar{align-items:stretch}.search{max-width:none}.table-wrap{border-radius:13px}}
  </style>
</head>
<body>
<div id="app" class="app">
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <img class="brand-logo" src="./assets/mmli-logo.jpeg" alt="Mind Masters Liberia Initiative logo">
        <div><div class="brand-name">MIND MASTERS LIBERIA</div><div class="brand-sub">INITIATIVE · OFFLINE STATISTICS</div></div>
      </div>
      <div class="offline-pill"><span class="dot"></span><span id="connectionText">OFFLINE-READY</span></div>
    </header>
    <nav id="nav" class="nav" aria-label="Main navigation"></nav>
    <main id="content" class="page"></main>
    <footer class="footer">Mind Masters Liberia Initiative · Master the Mind. Shape the Future.</footer>
  </div>
</div>
<div id="modalRoot"></div>
<script>
'use strict';
const APP_VERSION='2.0.0';
const DB_NAME='MMLI_Competition_Statistics';
const DB_VERSION=2;
const DIVISIONS=['Junior High','Senior High'];
const CATEGORIES=['English','Science','History','Mathematics','General Knowledge'];
const AWARD_CATEGORIES=['English','Science','History','Mathematics'];
const STORE_NAMES=['competitions','schools','students','games','answerRecords','settings'];
let db=null;
let state={section:'dashboard',competitionId:null,division:'Junior High',liveGameId:null,search:'',modal:null};
const $=id=>document.getElementById(id);
const uid=(prefix='id')=>prefix+'_'+crypto.randomUUID();
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const now=()=>new Date().toISOString();
const fmtDate=v=>v?new Date(v).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}):'—';
const fmtDateTime=v=>v?new Date(v).toLocaleString(undefined,{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
const toast=(message,type='info')=>{const el=document.createElement('div');el.textContent=message;el.style.cssText=`position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:300;padding:12px 17px;border-radius:999px;background:${type==='error'?'#8e2d36':type==='success'?'#176b4b':'#12345f'};border:1px solid rgba(255,255,255,.15);box-shadow:0 14px 35px rgba(0,0,0,.35);font-weight:850;max-width:90%;text-align:center`;document.body.appendChild(el);setTimeout(()=>{el.style.opacity='0';el.style.transition='.25s';setTimeout(()=>el.remove(),260)},2600)};
function confirmBox(message){return window.confirm(message)}
function openDB(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window))return reject(new Error('IndexedDB is not supported by this browser.'));const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=e=>{const d=e.target.result;for(const s of STORE_NAMES){if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:s==='settings'?'key':'id'})}const a=e.target.transaction.objectStore('answerRecords');[['competitionId','competitionId'],['gameId','gameId'],['studentId','studentId'],['schoolId','schoolId'],['division','division']].forEach(([n,p])=>{if(!a.indexNames.contains(n))a.createIndex(n,p,{unique:false})});const g=e.target.transaction.objectStore('games');[['competitionId','competitionId'],['division','division']].forEach(([n,p])=>{if(!g.indexNames.contains(n))g.createIndex(n,p,{unique:false})});const st=e.target.transaction.objectStore('students');[['schoolId','schoolId'],['division','division']].forEach(([n,p])=>{if(!st.indexNames.contains(n))st.createIndex(n,p,{unique:false})});};req.onsuccess=()=>{db=req.result;db.onversionchange=()=>db.close();resolve(db)};req.onerror=()=>reject(req.error)} )}
function tx(store,mode='readonly'){return db.transaction(store,mode).objectStore(store)}
function getAll(store){return new Promise((res,rej)=>{const r=tx(store).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function getOne(store,key){return new Promise((res,rej)=>{const r=tx(store).get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function put(store,obj){return new Promise((res,rej)=>{const t=db.transaction(store,'readwrite');const r=t.objectStore(store).put(obj);t.oncomplete=()=>res(obj);t.onerror=()=>rej(t.error||r.error);t.onabort=()=>rej(t.error||new Error('Database transaction aborted'))})}
function del(store,key){return new Promise((res,rej)=>{const t=db.transaction(store,'readwrite');t.objectStore(store).delete(key);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('Database transaction aborted'))})}
async function bulkReplace(snapshot){return new Promise((resolve,reject)=>{const t=db.transaction(STORE_NAMES,'readwrite');for(const s of STORE_NAMES){const os=t.objectStore(s);os.clear();for(const item of (snapshot[s]||[]))os.put(item)}t.oncomplete=resolve;t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error||new Error('Import transaction aborted'))})}
async function setting(key, fallback=null){const x=await getOne('settings',key);return x?x.value:fallback}
async function setSetting(key,value){await put('settings',{key,value})}
async function allData(){const out={schemaVersion:2,appVersion:APP_VERSION,exportedAt:now()};for(const s of STORE_NAMES)out[s]=await getAll(s);return out}
async function getComp(){return state.competitionId?getOne('competitions',state.competitionId):null}
async function schools(){return getAll('schools')}
async function students(){return getAll('students')}
async function games(){return getAll('games')}
async function answers(){return getAll('answerRecords')}
async function answersForGame(gameId){return (await answers()).filter(a=>a.gameId===gameId)}
async function answersForCompetition(compId){return (await answers()).filter(a=>a.competitionId===compId)}
function calcStudentStats(records,studentId){const rs=records.filter(a=>a.studentId===studentId);const out={total:rs.length,correct:0,wrong:0,accuracy:0};for(const c of CATEGORIES)out[c]=0;for(const r of rs){if(r.result==='Correct')out.correct++;else if(r.result==='Wrong')out.wrong++;if(Object.hasOwn(out,r.category))out[r.category]++}out.accuracy=out.total?Math.round(out.correct/out.total*1000)/10:0;return out}
function calcSchoolStats(records,schoolId){const rs=records.filter(a=>a.schoolId===schoolId);const correct=rs.filter(a=>a.result==='Correct').length;return {total:rs.length,correct,wrong:rs.filter(a=>a.result==='Wrong').length,accuracy:rs.length?Math.round(correct/rs.length*1000)/10:0,...Object.fromEntries(CATEGORIES.map(c=>[c,rs.filter(a=>a.category===c).length]))}}
function answerKey(gameId,half,q){return `${gameId}|${half}|${q}`}
async function findAnswer(gameId,half,q){const rs=await answersForGame(gameId);return rs.find(a=>a.half===half&&a.questionNumber===q)||null}
async function gameRoster(game){const st=await students();const rosterA=(game.rosterA||[]).map(id=>st.find(x=>x.id===id)).filter(Boolean);const rosterB=(game.rosterB||[]).map(id=>st.find(x=>x.id===id)).filter(Boolean);return {A:rosterA,B:rosterB,all:[...rosterA,...rosterB]}}
async function ensureState(){state.competitionId=await setting('currentCompetitionId',null);state.division=await setting('currentDivision','Junior High')||'Junior High';if(!DIVISIONS.includes(state.division))state.division='Junior High'}
function navRender(){const items=[['dashboard','⌂','Dashboard'],['competitions','🏆','Competitions'],['schools','🏫','Schools'],['students','👤','Students'],['games','🎮','Games'],['live','⚡','Live Game'],['stats','📈','Statistics'],['awards','🏅','Awards'],['backup','💾','Backup']];$('nav').innerHTML=items.map(([id,ic,label])=>`<button class="${state.section===id?'active':''}" data-nav="${id}">${ic} ${label}</button>`).join('')}
$('nav').addEventListener('click',e=>{const b=e.target.closest('[data-nav]');if(!b)return;state.section=b.dataset.nav;render()});
async function render(){navRender();try{const map={dashboard:renderDashboard,competitions:renderCompetitions,schools:renderSchools,students:renderStudents,games:renderGames,live:renderLive,stats:renderStats,awards:renderAwards,backup:renderBackup};await (map[state.section]||renderDashboard)()}catch(e){console.error(e);$('content').innerHTML=`<div class="card"><h2>Something went wrong</h2><div class="notice danger-note">${esc(e.message)}</div></div>`}}
function header(title,sub='',actions=''){return `<div class="toolbar"><div><h2>${title}</h2>${sub?`<div class="muted">${sub}</div>`:''}</div><div class="toolbar-actions">${actions}</div></div>`}
async function renderDashboard(){const comps=await getAll('competitions'),ss=await schools(),st=await students(),gs=await games(),as=await answers(),active=await getComp();const compGames=active?gs.filter(g=>g.competitionId===active.id):[];const compAnswers=active?as.filter(a=>a.competitionId===active.id):[];const divStudents=active?st.filter(s=>s.division===state.division):[];const completed=compGames.filter(g=>g.status==='Completed'||g.status==='Locked').length;const recent=[...compGames].sort((a,b)=>(b.updatedAt||b.createdAt||'').localeCompare(a.updatedAt||a.createdAt||'')).slice(0,5);$('content').innerHTML=`<section class="hero"><div class="eyebrow">MMLI · ${state.division}</div><h1>Competition Statistics & Awards</h1><p>Record every student's participation across every game, preserve first-half and second-half history, and keep the complete competition database offline until the official results are ready.</p><div class="hero-actions"><button class="btn btn-primary" onclick="go('games')">⚡ Open Live Game</button><button class="btn btn-ghost" onclick="go('backup')">💾 Backup Database</button><button class="btn btn-ghost" onclick="go('competitions')">🏆 Manage Competition</button></div></section><div class="grid grid-4 cards"><div class="card stat-card"><div class="stat-icon">🏆</div><div class="stat-value">${comps.length}</div><div class="stat-label">Competitions</div></div><div class="card stat-card"><div class="stat-icon">🎮</div><div class="stat-value">${completed}</div><div class="stat-label">Completed Games</div></div><div class="card stat-card"><div class="stat-icon">👤</div><div class="stat-value">${divStudents.length}</div><div class="stat-label">${state.division} Students</div></div><div class="card stat-card"><div class="stat-icon">📝</div><div class="stat-value">${compAnswers.length}</div><div class="stat-label">Questions Recorded</div></div></div><div class="grid grid-2 cards"><div class="card">${header('Active Competition',active?active.name:'No competiti async function showCompetition(id){const existing=id?await getOne('competitions',id):null;modal(existing?'Edit Competition':'New Competition',`<div class="form-grid"><div class="field full"><label>Competition name *</label><input id="cName" class="input" value="${esc(existing?.name||'')}" placeholder="Back-to-School Academic Quiz Challenge 2026"></div><div class="field"><label>Year</label><input id="cYear" class="input" value="${esc(existing?.year||new Date().getFullYear())}"></div><div class="field"><label>Venue</label><input id="cVenue" class="input" value="${esc(existing?.venue||'')}"></div><div class="field"><label>Start date</label><input id="cStart" type="date" class="input" value="${existing?.startDate||''}"></div><div class="field"><label>End date</label><input id="cEnd" type="date" class="input" value="${existing?.endDate||''}"></div><div class="field"><label>Organizer</label><input id="cOrg" class="input" value="${esc(existing?.organizer||'Mind Masters Liberia Initiative')}"></div><div class="field"><label>Status</label><select id="cStatus" class="select"><option>Draft</option><option>Active</option><option>Completed</option><option>Finalized</option></select></div><div class="field full"><label>Description</label><textarea id="cDesc" class="textarea" rows="3">${esc(existing?.description||'')}</textarea></div></div><div class="notice">Junior High and Senior High are always calculated separately. Finalized competitions should only be reopened by an authorized official.</div>`,`<div class="hero-actions"><button class="btn btn-primary" onclick="saveCompetition('${id||''}')">Save Competition</button><button class="btn btn-ghost" onclick="closeModal()">Cancel</button></div>`);if(existing)$('cStatus').value=existing.status||'Draft'}

async function removeCompetition(id){const c=await getOne('competitions',id);if(!c)return;if(c.status==='Finalized'&&!confirmBox('This competition is finalized. Delete it and all related records?'))return;if(!confirmBox(`Delete ${c.name} and ALL of its games and answer records? This cannot be undone unless you have a backup.`))return;const gs=(await games()).filter(g=>g.competitionId===id),as=(await answers()).filter(a=>a.competitionId===id);await Promise.all(as.map(a=>del('answerRecords',a.id)));await Promise.all(gs.map(g=>del('games',g.id)));await del('competitions',id);if(state.competitionId===id){state.competitionId=null;await setSetting('currentCompetitionId',null)}toast('Competition deleted','success');render()}window.removeCompetition=removeCompetition;
async function renderSchools(){const list=await schools();const q=state.search.toLowerCase();const rows=list.filter(s=>!q||s.name.toLowerCase().includes(q)||String(s.email||'').toLowerCase().includes(q));$('content').innerHTML=`<div class="card">${header('Schools','Maintain reusable school records for both divisions.',`<input class="input search" id="schoolSearch" placeholder="Search schools…" value="${esc(state.search)}"><button class="btn btn-primary" onclick="newSchool()">+ Add School</button>`)}${rows.length?`<div class="table-wrap"><table><thead><tr><th>School</th><th>Type</th><th>Address</th><th>Principal</th><th>Competition Contact</th><th>Actions</th></tr></thead><tbody>${rows.map(s=>`<tr><td><strong>${esc(s.name)}</strong></td><td>${esc(s.schoolType||'Both')}</td><td>${esc(s.address||'—')}</td><td>${esc(s.principalName||'—')}<br><span class="muted">${esc(s.principalContact||'')}</span></td><td>${esc(s.competitionContactName||'—')}<br><span class="muted">${esc(s.competitionContact||s.email||'')}</span></td><td><div class="toolbar-actions"><button class="btn btn-sm btn-ghost" onclick="editSchool('${s.id}')">Edit</button><button class="btn btn-sm btn-danger" onclick="removeSchool('${s.id}')">Delete</button></div></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><div class="big">🏫</div><p>No schools found.</p></div>`}</div>`;const search=$('schoolSearch');search?.addEventListener('input',()=>{state.search=search.value;renderSchools()})}

async function renderStudents(){const [st,ss]=await Promise.all([students(),schools()]);const q=state.search.toLowerCase();const rows=st.filter(s=>!q||s.fullName.toLowerCase().includes(q)||s.id.toLowerCase().includes(q));$('content').innerHTML=`<div class="card">${header('Students','Permanent MMLI student IDs keep participation history traceable.',`<input class="input search" id="studentSearch" placeholder="Search name or ID…" value="${esc(state.search)}"><button class="btn btn-primary" onclick="newStudent()">+ Register Student</button>`)}${rows.length?`<div class="table-wrap"><table><thead><tr><th>Student ID</th><th>Student</th><th>School</th><th>Division</th><th>Grade/Class</th><th>Actions</th></tr></thead><tbody>${rows.map(s=>{const school=ss.find(x=>x.id===s.schoolId);return `<tr><td><span class="badge">${esc(s.id)}</span></td><td><strong>${esc(s.fullName)}</strong></td><td>${esc(school?.name||'Unknown')}</td><td>${esc(s.division)}</td><td>${esc(s.grade||'—')}</td><td><div class="toolbar-actions"><button class="btn btn-sm btn-ghost" onclick="viewStudent('${s.id}')">Profile</button><button class="btn btn-sm btn-ghost" onclick="editStudent('${s.id}')">Edit</button><button class="btn btn-sm btn-danger" onclick="removeStudent('${s.id}')">Delete</button></div></td></tr>`}).join('')}</tbody></table></div>`:`<div class="empty"><div class="big">👤</div><p>No students found.</p></div>`}</div>`;$('studentSearch')?.addEventListener('input',e=>{state.search=e.target.value;renderStudents()})}

async function showStudent(id){const [e,ss]=await Promise.all([id?getOne('students',id):null,schools()]);modal(e?'Edit Student':'Register Student',`<div class="form-grid"><div class="field full"><label>Full name *</label><input id="stName" class="input" value="${esc(e?.fullName||'')}"></div><div class="field"><label>School *</label><select id="stSchool" class="select"><option value="">Select school</option>${ss.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>Division *</label><select id="stDiv" class="select"><option>Junior High</option><option>Senior High</option></select></div><div class="field"><label>Grade/Class</label><input id="stGrade" class="input" value="${esc(e?.grade||'')}"></div><div class="field"><label>Registration year</label><input id="stYear" class="input" value="${esc(e?.registrationYear||new Date().getFullYear())}"></div></div><div class="notice">The Student ID is permanent and must not be changed after participation records exist.</div>`,`<div class="hero-actions"><button class="btn btn-primary" onclick="saveStudent('${id||''}')">Save Student</button><button class="btn btn-ghost" onclick="closeModal()">Cancel</button></div>`);if(e){$('stSchool').value=e.schoolId;$('stDiv').value=e.division}}
async function saveStudent(id){const fullName=$('stName').value.trim(),schoolId=$('stSchool').value,division=$('stDiv').value;if(!fullName||!schoolId)return toast('Name and school are required','error');const e=id?await getOne('students',id):null;const existingAnswers=await answers();if(e&&existingAnswers.some(a=>a.studentId===id)&&(e.schoolId!==schoolId||e.division!==division))return toast('This student already has competition history. School and division cannot be changed because it would corrupt historical statistics.','error');let newId=id;if(!newId){const all=await students();const nums=all.map(s=>String(s.id||'').match(/^MMLI-STU-(\d+)$/)).filter(Boolean).map(m=>Number(m[1]));const next=(nums.length?Math.max(...nums):0)+1;newId=`MMLI-STU-${String(next).padStart(6,'0')}`}const data={id:newId,fullName,schoolId,division,grade:$('stGrade').value.trim(),registrationYear:$('stYear').value.trim(),createdAt:e?.createdAt||now(),updatedAt:now()};await put('students',data);closeModal();toast('Student saved','success');renderStudents()}window.saveStudent=saveStudent;
async function removeStudent(id){const used=(await answers()).some(a=>a.studentId===id),inGame=(await games()).some(g=>(g.rosterA||[]).includes(id)||(g.rosterB||[]).includes(id));if(used||inGame)return toast('This student has competition history. Do not delete the record; preserve it for auditability.','error');if(confirmBox('Delete this student?')){await del('students',id);toast('Student deleted','success');renderStudents()}}window.removeStudent=removeStudent;
async function viewStudent(id){const [s,ss,as,gs]=await Promise.all([getOne('students',id),schools(),answers(),games()]);if(!s)return;const school=ss.find(x=>x.id===s.schoolId),records=as.filter(a=>a.studentId===id),stats=calcStudentStats(records,id),gameRows=gs.filter(g=>(g.rosterA||[]).includes(id)||(g.rosterB||[]).includes(id)).sort((a,b)=>(a.gameNumber||0)-(b.gameNumber||0));modal('Student Profile',`<div class="hero"><div class="eyebrow">${esc(s.division)}</div><h1 style="font-size:2rem">${esc(s.fullName)}</h1><p>${esc(school?.name||'Unknown school')} · ${esc(s.id)}</p></div><div class="grid grid-4 cards"><div class="card stat-card"><div class="stat-value">${stats.total}</div><div class="stat-label">Questions Answered</div></div><div class="card stat-card"><div class="stat-value">${stats.correct}</div><div class="stat-label">Correct</div></div><div class="card stat-card"><div class="stat-value">${stats.wrong}</div><div class="stat-label">Wrong</div></div><div class="card stat-card"><div class="stat-value">${stats.accuracy}%</div><div class="stat-label">Accuracy</div></div></div><div class="card"><h3>Category Participation</h3><div class="table-wrap"><table><thead><tr><th>Category</th><th>Answered</th><th>Correct</th><th>Accuracy</th></tr></thead><tbody>${CATEGORIES.map(c=>{const r=records.filter(a=>a.category===c),co=r.filter(a=>a.result==='Correct').length;return `<tr><td><strong>${c}</strong></td><td>${r.length}</td><td>${co}</td><td>${r.length?Math.round(co/r.length*1000)/10:0}%</td></tr>`}).join('')}</tbody></table></div></div><div class="card"><h3>Game History</h3>${gameRows.length?`<div class="table-wrap"><table><thead><tr><th>Game</th><th>Division</th><th>Match</th><th>Questions</th><th>Correct</th></tr></thead><tbody>${gameRows.map(g=>{const r=records.filter(a=>a.gameId===g.id),co=r.filter(a=>a.result==='Correct').length;return `<tr><td>Game ${g.gameNumber}</td><td>${g.division}</td><td>${esc(g.schoolAName)} vs ${esc(g.schoolBName)}</td><td>${r.length}</td><td>${co}</td></tr>`}).join('')}</tbody></table></div>`:`<div class="empty">No games recorded.</div>`}</div>`)}
async function renderGames(){const [gs,ss,comps]=await Promise.all([games(),schools(),getAll('competitions')]);const active=state.competitionId;const rows=gs.filter(g=>g.competitionId===active);$('content').innerHTML=`<div class="card">${header('Games','Exactly 2 schools and exactly 6 students per school are required for every game.',`<button class="btn btn-primary" onclick="newGame()">+ New Game</button>`)}${!active?`<div class="notice danger-note">Select a competition first.</div>`:rows.length?`<div class="table-wrap"><table><thead><tr><th>Game</th><th>Division</th><th>School A</th><th>School B</th><th>Half Status</th><th>Game Status</th><th>Actions</th></tr></thead><tbody>${rows.sort((a,b)=>(a.gameNumber||0)-(b.gameNumber||0)).map(g=>`<tr><td><strong>Game ${g.gameNumber}</strong></td><td>${esc(g.division)}</td><td>${esc(g.schoolAName)}</td><td>${esc(g.schoolBName)}</td><td><span class="badge">1st: ${esc(g.firstHalfStatus)}</span> <span class="badge">2nd: ${esc(g.secondHalfStatus)}</span></td><td><span class="badge ${g.status==='Completed'||g.status==='Locked'?'green':'gold'}">${esc(g.status)}</span></td><td><div class="toolbar-actions">${g.status!=='Completed'&&g.status!=='Locked'?`<button class="btn btn-sm btn-success" onclick="startLive('${g.id}')">▶ Live</button>`:''}<button class="btn btn-sm btn-ghost" onclick="editGame('${g.id}')">Edit</button><button class="btn btn-sm btn-danger" onclick="removeGame('${g.id}')">Delete</button></div></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><div class="big">🎮</div><p>No games in this competition.</p></div>`}</div>`}

async function showGame(id){if(!state.competitionId)return toast('Select a competition first','error');const [e,ss,st]=await Promise.all([id?getOne('games',id):null,schools(),students()]);const div=e?.division||state.division;const eligibleSchools=ss.filter(s=>s.schoolType==='Both'||s.schoolType===div);modal(e?'Edit Game':'Create Game',`<div class="form-grid"><div class="field"><label>Game number *</label><input id="gNum" type="number" min="1" class="input" value="${esc(e?.gameNumber||'')}"></div><div class="field"><label>Division *</label><select id="gDiv" class="select"><option>Junior High</option><option>Senior High</option></select></div><div class="field"><label>School A *</label><select id="gA" class="select"><option value="">Select school</option>${eligibleSchools.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>School B *</label><select id="gB" class="select"><option value="">Select school</option>${eligibleSchools.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div></div><div id="rosterHelp" class="notice">Choose the two schools, then select exactly 6 students for each school.</div><div class="grid grid-2"><div><h3>School A Roster</h3><div id="rosterA"></div></div><div><h3>School B Roster</h3><div id="rosterB"></div></div></div>`,`<div class="hero-actions"><button class="btn btn-primary" onclick="saveGame('${id||''}')">Save Game</button><button class="btn btn-ghost" onclick="closeModal()">Cancel</button></div>`);if(e){$('gNum').value=e.gameNumber;$('gDiv').value=e.division;$('gA').value=e.schoolAId;$('gB').value=e.schoolBId}const update=async()=>{const divv=$('gDiv').value,a=$('gA').value,b=$('gB').value;const listA=st.filter(x=>x.schoolId===a&&x.division===divv),listB=st.filter(x=>x.schoolId===b&&x.division===divv);renderRoster('rosterA',listA,e?.rosterA||[],'ra');renderRoster('rosterB',listB,e?.rosterB||[],'rb');$('rosterHelp').innerHTML=(a&&b&&a===b)?'<strong>Choose two different schools.</strong>':`School A: ${listA.length} eligible students · School B: ${listB.length} eligible students. Each roster must contain exactly 6.`};$('gA').addEventListener('change',update);$('gB').addEventListener('change',update);$('gDiv').addEventListener('change',update);update()}
function renderRoster(id,list,selected,prefix){$(id).innerHTML=list.length?`<div style="display:grid;gap:7px">${list.map((s,i)=>`<label style="display:flex;align-items:center;gap:9px;padding:9px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.03);cursor:pointer"><input type="checkbox" name="${prefix}" value="${s.id}" ${selected.includes(s.id)?'checked':''}> <span><strong>${i+1}. ${esc(s.fullName)}</strong><br><small class="muted">${esc(s.id)}</small></span></label>`).join('')}</div>`:`<div class="empty" style="padding:18px">No eligible students registered.</div>`}
async function saveGame(id){const num=Number($('gNum').value),division=$('gDiv').value,a=$('gA').value,b=$('gB').value,ra=[...document.querySelectorAll('input[name="ra"]:checked')].map(x=>x.value),rb=[...document.querySelectorAll('input[name="rb"]:checked')].map(x=>x.value);if(!Number.isInteger(num)||num<1)return toast('Enter a valid game number','error');if(!a||!b||a===b)return toast('Select two different schools','error');if(ra.length!==6||rb.length!==6)return toast(`Each school must have exactly 6 students selected. You selected ${ra.length} and ${rb.length}.`,'error');const st=await students();const ids=[...ra,...rb];if(new Set(ids).size!==12)return toast('A student cannot appear twice in the same game.','error');if(ids.some(x=>{const s=st.find(y=>y.id===x);return !s||s.division!==division}))return toast('Every roster student must belong to the selected division.','error');const all=await games();const duplicate=all.find(g=>g.competitionId===state.competitionId&&g.division===division&&g.gameNumber===num&&g.id!==id);if(duplicate)return toast('That game number already exists in this division.','error');const sa=await getOne('schools',a),sb=await getOne('schools',b),existing=id?await getOne('games',id):null;if(existing&&existing.status==='Completed')return toast('Completed games are locked from roster changes.','error');if(existing){const prior=await answersForGame(existing.id);if(prior.length&&(existing.division!==division||existing.schoolAId!==a||existing.schoolBId!==b||JSON.stringify(existing.rosterA||[])!==JSON.stringify(ra)||JSON.stringify(existing.rosterB||[])!==JSON.stringify(rb)))return toast('This game already has answer records. Division, schools, and rosters cannot be changed after recording begins.','error')}const data={id:id||uid('game'),competitionId:state.competitionId,division,gameNumber:num,schoolAId:a,schoolBId:b,schoolAName:sa.name,schoolBName:sb.name,rosterA:ra,rosterB:rb,status:existing?.status||'Scheduled',firstHalfStatus:existing?.firstHalfStatus||'Not Started',secondHalfStatus:existing?.secondHalfStatus||'Not Started',currentHalf:existing?.currentHalf||1,currentQuestion:existing?.currentQuestion||1,createdAt:existing?.createdAt||now(),updatedAt:now()};await put('games',data);closeModal();toast('Game saved','success');renderGames()}window.saveGame=saveGame;
async function removeGame(id){const g=await getOne('games',id);if(!g)return;if(g.status==='Completed'||g.status==='Locked')return toast('Completed games cannot be deleted from the normal workflow. Export a backup and use an administrator recovery process if necessary.','error');if(!confirmBox('Delete this game and its answer records?'))return;for(const a of await answersForGame(id))await del('answerRecords',a.id);await del('games',id);toast('Game deleted','success');renderGames()}window.removeGame=removeGame;
async function startLive(id){const g=await getOne('games',id);if(!g)return;if(g.status==='Completed'||g.status==='Locked')return toast('This game is completed and locked.','error');state.liveGameId=id;state.section='live';if(g.status==='Scheduled')g.status='First Half';g.currentHalf=g.currentHalf||1;g.currentQuestion=g.currentQuestion||1;g.firstHalfStatus=g.currentHalf===1?'In Progress':g.firstHalfStatus;g.secondHalfStatus=g.currentHalf===2?'In Progress':g.secondHalfStatus;g.updatedAt=now();await put('games',g);render()}window.startLive=startLive;
let live={selectedStudent:null,category:'Mathematics'};
async function renderLive(){if(!state.liveGameId){$('content').innerHTML=`<div class="card">${header('Live Game','Select a scheduled game from Games to begin.') }<div class="empty"><div class="big">⚡</div><p>No live game selected.</p><button class="btn btn-primary" onclick="go('games')">Open Games</button></div></div>`;return}const [g,roster]=await Promise.all([getOne('games',state.liveGameId),gameRoster(await getOne('games',state.liveGameId))]);if(!g){state.liveGameId=null;return renderLive()}const records=await answersForGame(g.id);const currentHalf=g.currentHalf||1,currentQuestion=g.currentQuestion||1;const currentAnswer=records.find(a=>a.half===currentHalf&&a.questionNumber===currentQuestion);if(currentAnswer)live.selectedStudent=currentAnswer.studentId;const statA=roster.A.map(s=>({s,stats:calcStudentStats(records,s.id)})),statB=roster.B.map(s=>({s,stats:calcStudentStats(records,s.id)}));const studentButtons=(arr,prefix)=>arr.map((x,i)=>{const ans=records.find(a=>a.half===currentHalf&&a.questionNumber===currentQuestion&&a.studentId===x.s.id);let cls='student-btn';if(ans)cls+=' '+ans.result.toLowerCase();if(live.selectedStudent===x.s.id)cls+=' selected';return `<button class="${cls}" onclick="selectLiveStudent('${x.s.id}')"><span class="student-number">${prefix}${i+1}</span>${esc(x.s.fullName)}</button>`}).join('');const statsTable=[...statA,...statB].map(x=>`<tr><td>${esc(x.s.fullName)}</td><td>${x.stats.English}</td><td>${x.stats.Science}</td><td>${x.stats.History}</td><td>${x.stats.Mathematics}</td><td>${x.stats['General Knowledge']}</td><td><strong>${x.stats.total}</strong></td><td>${x.stats.accuracy}%</td></tr>`).join('');$('content').innerHTML=`<div class="live-shell"><div class="live-top"><div class="team-title">${esc(g.schoolAName)}</div><div class="versus">VS</div><div class="team-title right">${esc(g.schoolBName)}</div></div><div class="halfbar"><span class="${currentHalf===1?'active':''}">FIRST HALF</span><span class="${currentHalf===2?'active':''}">SECOND HALF</span></div><div class="question-card"><div class="eyebrow">${esc(g.division)} · GAME ${g.gameNumber}</div><div class="qnum">Q${currentQuestion}</div><div class="muted">Select the category and the student who answered this question.</div><div class="category-pills">${CATEGORIES.map(c=>`<button class="cat ${live.category===c?'active':''}" onclick="setLiveCategory('${c}')">${c}</button>`).join('')}</div>${live.category==='General Knowledge'&&records.some(a=>a.category==='General Knowledge')?`<div class="notice danger-note">The competition rule is one General Knowledge question per game. The recorded GK question is shown in the game history and cannot be duplicated.</div>`:''}</div><div class="selected-note">${live.selectedStudent?`Selected: <strong>${esc((await getOne('students',live.selectedStudent))?.fullName||'Student')}</strong>`:'No student selected'}</div><div class="student-columns"><div class="school-panel"><h3>School A · 6 Students</h3><div class="student-grid">${studentButtons(statA,'A')}</div></div><div class="school-panel"><h3>School B · 6 Students</h3><div class="student-grid">${studentButtons(statB,'B')}</div></div></div><div class="live-actions"><button class="btn btn-success" onclick="recordLive('Correct')">✓ Correct</button><button class="btn btn-danger" onclick="recordLive('Wrong')">✕ Wrong</button><button class="btn btn-ghost" onclick="prevLiveQuestion()">← Previous</button><button class="btn btn-ghost" onclick="nextLiveQuestion()">Next Question →</button><button class="btn btn-primary" onclick="endHalf()">End Half</button><button class="btn btn-ghost" onclick="exitLive()">Save & Exit</button><button class="btn btn-danger" onclick="completeGame()">Finish Game</button></div><div class="card" style="margin-top:18px"><h3>Live Individual Statistics</h3><div class="table-wrap"><table><thead><tr><th>Student</th><th>English</th><th>Science</th><th>History</th><th>Mathematics</th><th>GK</th><th>Total</th><th>Accuracy</th></tr></thead><tbody>${statsTable}</tbody></table></div></div></div>`}
window.selectLiveStudent=id=>{live.selectedStudent=id;renderLive()};window.setLiveCategory=cat=>{live.category=cat;renderLive()};
async function prevLiveQuestion(){const g=await getOne('games',state.liveGameId);if(!g)return;if(g.currentQuestion<=1)return toast('Already at the first question of this half.','error');g.currentQuestion--;live.selectedStudent=null;const a=await findAnswer(g.id,g.currentHalf,g.currentQuestion);if(a)live.selectedStudent=a.studentId;await put('games',g);renderLive()}window.prevLiveQuestion=prevLiveQuestion;
async function recordLive(result){const g=await getOne('games',state.liveGameId);if(!g)return;if(!live.selectedStudent)return toast('Select the student who answered first.','error');if(g.currentHalf===1&&g.firstHalfStatus==='Completed')return toast('First half is locked.','error');if(g.currentHalf===2&&g.secondHalfStatus==='Completed')return toast('Second half is locked.','error');const records=await answersForGame(g.id);if(live.category==='General Knowledge'&&records.some(a=>a.category==='General Knowledge'))return toast('Only one General Knowledge question is allowed per game.','error');const existing=records.find(a=>a.half===g.currentHalf&&a.questionNumber===g.currentQuestion);const student=await getOne('students',live.selectedStudent);if(!student)return toast('Student not found.','error');const payload={id:existing?.id||uid('answer'),competitionId:g.competitionId,division:g.division,gameId:g.id,half:g.currentHalf,questionNumber:g.currentQuestion,category:live.category,studentId:student.id,schoolId:student.schoolId,result,timestamp:existing?.timestamp||now(),updatedAt:now()};await put('answerRecords',payload);toast(existing?'Answer updated':'Answer recorded','success');live.selectedStudent=null;g.currentQuestion++;g.updatedAt=now();await put('games',g);renderLive()}window.recordLive=recordLive;
async function nextLiveQuestion(){const g=await getOne('games',state.liveGameId);if(!g)return;if(!live.selectedStudent){const a=await findAnswer(g.id,g.currentHalf,g.currentQuestion);if(!a)return toast('Record an answer or explicitly skip this question.','error')}g.currentQuestion++;live.selectedStudent=null;await put('games',g);renderLive()}window.nextLiveQuestion=nextLiveQuestion;
async function endHalf(){const g=await getOne('games',state.liveGameId);if(!g)return;if(g.currentHalf===1){if(!confirmBox('End the First Half? The first-half records will be locked.'))return;g.firstHalfStatus='Completed';g.currentHalf=2;g.currentQuestion=1;g.secondHalfStatus='In Progress';g.status='Second Half';live.selectedStudent=null;await put('games',g);toast('Second Half started','success');renderLive()}else{return toast('You are already in the Second Half. Finish the game when all questions are recorded.','error')}}window.endHalf=endHalf;
async function completeGame(){const g=await getOne('games',state.liveGameId);if(!g)return;if(g.currentHalf!==2||g.firstHalfStatus!=='Completed')return toast('Complete the First Half before finishing the game.','error');if(!confirmBox('Finish this game? The second half and the entire game will be locked for normal editing.'))return;g.secondHalfStatus='Completed';g.status='Completed';g.updatedAt=now();await put('games',g);state.liveGameId=null;live.selectedStudent=null;toast('Game completed and saved','success');go('games')}window.completeGame=completeGame;
function exitLive(){state.liveGameId=null;live.selectedStudent=null;go('games')}window.exitLive=exitLive;
async function renderStats(){if(!state.competitionId)return $('content').innerHTML=`<div class="card"><div class="empty"><div class="big">📈</div><p>Select a competition first.</p></div></div>`;const [as,st,ss,gs]=await Promise.all([answersForCompetition(state.competitionId),students(),schools(),games()]);const divSt=st.filter(s=>s.division===state.division);const activeGames=gs.filter(g=>g.competitionId===state.competitionId&&g.division===state.division);const rows=divSt.map(s=>({s,stats:calcStudentStats(as.filter(a=>a.division===state.division),s.id),school:ss.find(x=>x.id===s.schoolId)})).sort((a,b)=>b.stats.total-a.stats.total||b.stats.correct-a.stats.correct);const schoolRows=ss.map(s=>({s,stats:calcSchoolStats(as.filter(a=>a.division===state.division),s.id),games:activeGames.filter(g=>g.schoolAId===s.id||g.schoolBId===s.id).length})).filter(x=>x.games||x.stats.total).sort((a,b)=>b.stats.total-a.stats.total);$('content').innerHTML=`<div class="card">${header(`Statistics · ${state.division}`,`Cumulative across every completed and in-progress game in ${esc((await getComp())?.name||'the selected competition')}`,`<button class="btn btn-sm ${state.division==='Junior High'?'btn-primary':'btn-ghost'}" onclick="setDivision('Junior High')">Junior High</button><button class="btn btn-sm ${state.division==='Senior High'?'btn-primary':'btn-ghost'}" onclick="setDivision('Senior High')">Senior High</button>`)}<div class="grid grid-2"><div class="card"><h3>Individual Leaderboard</h3><div class="table-wrap"><table><thead><tr><th>Rank</th><th>Student</th><th>School</th><th>EN</th><th>SCI</th><th>HIST</th><th>MATH</th><th>GK</th><th>Total</th><th>Accuracy</th></tr></thead><tbody>${rows.length?rows.map((x,i)=>`<tr><td class="rank">${i+1}</td><td><strong>${esc(x.s.fullName)}</strong></td><td>${esc(x.school?.name||'—')}</td><td>${x.stats.English}</td><td>${x.stats.Science}</td><td>${x.stats.History}</td><td>${x.stats.Mathematics}</td><td>${x.stats['General Knowledge']}</td><td><strong>${x.stats.total}</strong></td><td>${x.stats.accuracy}%</td></tr>`).join(''):`<tr><td colspan="10" class="empty">No statistics yet.</td></tr>`}</tbody></table></div></div><div class="card"><h3>School Statistics</h3><div class="table-wrap"><table><thead><tr><th>Rank</th><th>School</th><th>Games</th><th>EN</th><th>SCI</th><th>HIST</th><th>MATH</th><th>GK</th><th>Total</th><th>Accuracy</th></tr></thead><tbody>${schoolRows.length?schoolRows.map((x,i)=>`<tr><td class="rank">${i+1}</td><td><strong>${esc(x.s.name)}</strong></td><td>${x.games}</td><td>${x.stats.English}</td><td>${x.stats.Science}</td><td>${x.stats.History}</td><td>${x.stats.Mathematics}</td><td>${x.stats['General Knowledge']}</td><td><strong>${x.stats.total}</strong></td><td>${x.stats.accuracy}%</td></tr>`).join(''):`<tr><td colspan="10" class="empty">No school statistics yet.</td></tr>`}</tbody></table></div></div></div></div>`}
function awardData(records,studentsList,division){const div=studentsList.filter(s=>s.division===division);const out={};for(const cat of AWARD_CATEGORIES){const ranked=div.map(s=>({s,stats:calcStudentStats(records,s.id)})).filter(x=>x.stats[cat]>0).sort((a,b)=>b.stats[cat]-a.stats[cat]||b.stats.correct-a.stats.correct);if(!ranked.length){out[cat]=null;continue}const top=ranked[0].stats[cat];out[cat]={metric:top,winners:ranked.filter(x=>x.stats[cat]===top)}}const ranked=div.map(s=>({s,stats:calcStudentStats(records,s.id)})).filter(x=>x.stats.total>0).sort((a,b)=>b.stats.total-a.stats.total||b.stats.correct-a.stats.correct);out.MVQ=ranked.length?{metric:ranked[0].stats.total,winners:ranked.filter(x=>x.stats.total===ranked[0].stats.total)}:null;return out}
async function renderAwards(){if(!state.competitionId)return $('content').innerHTML=`<div class="card"><div class="empty"><div class="big">🏅</div><p>Select a competition first.</p></div></div>`;const [as,st,ss]=await Promise.all([answersForCompetition(state.competitionId),students(),schools()]);const cards=[];for(const div of DIVISIONS){const awards=awardData(as.filter(a=>a.division===div),st,div);cards.push(`<div class="card">${header(`${div} Awards`,`Calculated from the complete competition record.`)}<div class="grid grid-2">${[...AWARD_CATEGORIES.map(c=>[c,`Best ${c} Quizzer`]),['MVQ','Most Valuable Quizzer']].map(([key,label])=>{const a=awards[key];if(!a)return `<div class="award"><div class="award-icon">🏅</div><h3>${label}</h3><div class="winner muted">No qualifying record yet</div></div>`;const names=a.winners.map(x=>{const school=ss.find(s=>s.id===x.s.schoolId);return `<div>${esc(x.s.fullName)} <span class="muted">· ${esc(school?.name||'')}</span></div>`}).join('');return `<div class="award"><div class="award-icon">${key==='MVQ'?'👑':'🏆'}</div><h3>${label}</h3><div class="winner ${a.winners.length>1?'tie':''}">${names}</div><div class="metric">${a.metric} questions answered${a.winners.length>1?' · TIE':''}</div></div>`}).join('')}</div></div>`)}$('content').innerHTML=`<div>${cards.join('')}</div><div class="card cards"><div class="notice">Award rule: category awards and MVQ are based on <strong>questions answered</strong>, not questions correct. Accuracy is additional information only. Ties are shown rather than silently broken.</div></div>`}
async function renderBackup(){const comps=await getAll('competitions'),ss=await schools(),st=await students(),gs=await games(),as=await answers(),last=await setting('lastBackup',null);$('content').innerHTML=`<div class="grid grid-2"><div class="card">${header('Backup & Restore','Protect the entire offline competition database.') }<div class="hero-actions"><button class="btn btn-primary" onclick="exportDatabase()">📤 Export Complete Database</button><button class="btn btn-ghost" onclick="document.getElementById('importDb').click()">📥 Restore Database</button><input id="importDb" type="file" accept="application/json,.json" hidden></div><div class="notice" style="margin-top:14px"><strong>Last backup:</strong> ${last?fmtDateTime(last):'Never'}<br><span class="muted">Export regularly, especially after completed games.</span></div></div><div class="card">${header('Database Summary')}<div class="grid grid-2"><div><div class="stat-value">${comps.length}</div><div class="stat-label">Competitions</div></div><div><div class="stat-value">${ss.length}</div><div class="stat-label">Schools</div></div><div><div class="stat-value">${st.length}</div><div class="stat-label">Students</div></div><div><div class="stat-value">${gs.length}</div><div class="stat-label">Games</div></div><div><div class="stat-value">${as.length}</div><div class="stat-label">Answer Records</div></div></div></div></div><div class="card cards">${header('Website Export','Prepare approved competition data for a future MMLI online statistics portal.',`<button class="btn btn-primary" onclick="exportWebsiteData()">🌐 Export Website Data</button>`)}<div class="notice">Version 1 is intentionally offline. This export is structured so a future website/database connector can consume the data without changing the competition recording logic.</div></div>`;$('importDb').addEventListener('change',e=>importDatabase(e.target.files[0]))}
async function exportDatabase(){const data=await allData();const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});downloadBlob(blob,`MMLI_Competition_Database_${new Date().toISOString().slice(0,10)}.json`);await setSetting('lastBackup',now());toast('Complete database backup exported','success');renderBackup()}
async function exportWebsiteData(){const data=await allData();const comps=await getAll('competitions'),ss=await schools(),st=await students(),gs=await games(),as=await answers();data.publicExport={generatedAt:now(),competitions:comps.map(c=>({...c,publicStatus:c.status==='Finalized'?'Approved':'Draft'})),schools:ss,students:st,games:gs.filter(g=>g.status==='Completed'||g.status==='Locked'),answerRecords:as.filter(a=>gs.some(g=>g.id===a.gameId&&(g.status==='Completed'||g.status==='Locked')))};delete data.settings;downloadBlob(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),`MMLI_Website_Statistics_${new Date().toISOString().slice(0,10)}.json`);toast('Website-ready export created','success')}
function downloadBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),500)}
async function importDatabase(file){if(!file)return;try{const data=JSON.parse(await file.text());if(!data||data.schemaVersion!==2||!Array.isArray(data.competitions)||!Array.isArray(data.answerRecords))throw new Error('Unsupported or invalid MMLI backup.');if(!confirmBox('RESTORE will replace all local MMLI data on this device. Continue?'))return;await bulkReplace(data);await ensureState();toast('Database restored successfully','success');state.section='dashboard';render()}catch(e){console.error(e);toast('Restore failed: '+e.message,'error')}}
window.exportDatabase=exportDatabase;window.exportWebsiteData=exportWebsiteData;
async function boot(){try{await openDB();await ensureState();$('connectionText').textContent=navigator.onLine?'OFFLINE-READY · ONLINE AVAILABLE':'OFFLINE MODE';window.addEventListener('online',()=>{$('connectionText').textContent='OFFLINE-READY · ONLINE AVAILABLE'});window.addEventListener('offline',()=>{$('connectionText').textContent='OFFLINE MODE'});if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./service-worker.js').catch(console.warn);await render();}catch(e){$('content').innerHTML=`<div class="card"><h2>Database initialization failed</h2><div class="notice danger-note">${esc(e.message)}</div><p class="muted">Use a modern browser with IndexedDB enabled. Do not use private/incognito mode for official competition records.</p></div>`}}
boot();
</script>
