<html lang="en">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #0b1e3a; color: #f0f4fc; min-height: 100vh; }
    :root { --navy: #0e2c57; --gold: #f9c040; --gold-light: #ffd966; --white: #f0f4fc; --dark-bg: #0b1e3a; --card-bg: #142d5a; --shadow: 0 12px 30px rgba(0,0,0,0.5); }
    .app { max-width: 1400px; margin: 0 auto; padding: 0 16px 80px; }
    /* header & branding */
    .header { display: flex; align-items: center; gap: 12px; padding: 20px 0 12px; border-bottom: 2px solid var(--gold); flex-wrap: wrap; }
    .logo { display: flex; align-items: center; gap: 8px; }
    .logo svg { width: 48px; height: 48px; }
    .logo-text { font-weight: 700; font-size: 1.6rem; letter-spacing: 1px; color: var(--white); }
    .logo-text span { color: var(--gold); }
    .subhead { margin-left: auto; font-size: 0.9rem; background: var(--gold); color: #0b1e3a; padding: 6px 18px; border-radius: 40px; font-weight: 600; }
    /* nav */
    .nav-row { display: flex; flex-wrap: wrap; gap: 6px 10px; margin: 16px 0 20px; background: var(--card-bg); padding: 8px 12px; border-radius: 60px; box-shadow: var(--shadow); }
    .nav-btn { background: transparent; border: none; color: #b0c8f0; padding: 8px 16px; border-radius: 40px; font-weight: 600; font-size: 0.9rem; cursor: pointer; transition: 0.2s; white-space: nowrap; }
    .nav-btn.active { background: var(--gold); color: #0b1e3a; box-shadow: 0 4px 8px rgba(249,192,64,0.3); }
    .nav-btn:hover { background: rgba(249,192,64,0.15); }
    /* cards */
    .card { background: var(--card-bg); border-radius: 28px; padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow); border: 1px solid rgba(255,255,255,0.05); }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px,1fr)); gap: 18px; }
    .stat-number { font-size: 2.6rem; font-weight: 800; color: var(--gold); line-height: 1; }
    .stat-label { font-size: 0.9rem; opacity: 0.8; text-transform: uppercase; letter-spacing: 0.5px; }
    .flex { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .gap-8 { gap: 8px; }
    .btn { background: var(--gold); color: #0b1e3a; border: none; padding: 10px 24px; border-radius: 60px; font-weight: 700; font-size: 0.95rem; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
    .btn-outline { background: transparent; border: 2px solid var(--gold); color: var(--gold); }
    .btn-sm { padding: 6px 16px; font-size: 0.8rem; }
    .btn-danger { background: #d45a5a; color: white; }
    .btn-success { background: #3ba87c; color: white; }
    .btn:active { transform: scale(0.96); }
    .mb-12 { margin-bottom: 12px; }
    .mt-12 { margin-top: 12px; }
    /* live game */
    .live-header { background: var(--navy); padding: 12px 20px; border-radius: 60px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; border-left: 6px solid var(--gold); }
    .question-badge { background: var(--gold); color: #0b1e3a; padding: 4px 16px; border-radius: 40px; font-weight: 700; }
    .student-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px,1fr)); gap: 8px; margin: 12px 0; }
    .student-btn { background: #1f3d70; border: 2px solid transparent; padding: 12px 4px; border-radius: 60px; text-align: center; font-weight: 600; font-size: 0.9rem; color: white; transition: 0.15s; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
    .student-btn:active { transform: scale(0.94); }
    .student-btn.selected { border-color: var(--gold); background: #2a4a82; }
    .student-btn.correct { background: #2d8f5e; border-color: #7ddfb0; }
    .student-btn.wrong { background: #a04141; border-color: #e67a7a; }
    .category-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    .cat-btn { background: #1f3d70; border: 2px solid #2a4a82; padding: 8px 18px; border-radius: 60px; font-weight: 600; color: white; cursor: pointer; transition: 0.1s; }
    .cat-btn.active { background: var(--gold); color: #0b1e3a; border-color: var(--gold); }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1a2f4a; color: white; padding: 12px 28px; border-radius: 60px; box-shadow: 0 8px 30px rgba(0,0,0,0.6); border-left: 6px solid var(--gold); z-index: 999; opacity: 0; transition: 0.3s; pointer-events: none; }
    .toast.show { opacity: 1; pointer-events: auto; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
    .modal { background: var(--card-bg); max-width: 600px; width: 100%; border-radius: 40px; padding: 28px; max-height: 90vh; overflow-y: auto; border: 1px solid var(--gold); }
    .modal h2 { color: var(--gold); }
    .input-field { width: 100%; padding: 14px 18px; border-radius: 40px; border: 2px solid #2a4a82; background: #0b1e3a; color: white; font-size: 1rem; margin-bottom: 10px; }
    .input-field:focus { border-color: var(--gold); outline: none; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th { text-align: left; padding: 10px 6px; border-bottom: 2px solid var(--gold); color: var(--gold); }
    td { padding: 8px 6px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .text-gold { color: var(--gold); }
    .text-muted { opacity: 0.6; }
    @media (max-width: 640px) { .logo-text { font-size: 1.2rem; } .nav-row { gap: 4px; } .nav-btn { padding: 6px 12px; font-size: 0.75rem; } .student-grid { grid-template-columns: repeat(3,1fr); } }
  </style>
</head>
<body>
  <div class="app" id="app">
    <div class="header">
      <div class="logo">
        <svg viewBox="0 0 100 100" width="48" height="48"><rect width="100" height="100" fill="#0e2c57" rx="20"/><text x="50" y="65" text-anchor="middle" fill="#f9c040" font-size="38" font-weight="800" font-family="Segoe UI, sans-serif">MM</text><text x="50" y="90" text-anchor="middle" fill="#f9c040" font-size="18" font-weight="600">LI</text></svg>
        <div class="logo-text">MIND <span>MASTERS</span> · LI</div>
      </div>
      <div class="subhead">OFFLINE v1</div>
    </div>
    <div class="nav-row" id="navRow">
      <button class="nav-btn active" data-section="dashboard">📊 Dashboard</button>
      <button class="nav-btn" data-section="competitions">🏆 Comp</button>
      <button class="nav-btn" data-section="schools">🏫 Schools</button>
      <button class="nav-btn" data-section="students">👨‍🎓 Students</button>
      <button class="nav-btn" data-section="games">🎮 Games</button>
      <button class="nav-btn" data-section="live">⚡ Live</button>
      <button class="nav-btn" data-section="stats">📈 Stats</button>
      <button class="nav-btn" data-section="awards">🏅 Awards</button>
      <button class="nav-btn" data-section="backup">💾 Backup</button>
    </div>
    <div id="pageContent"></div>
    <div id="toast" class="toast">Ready</div>
  </div>
  <script>
    // --------------------------------------------------------------
    // MMLI OFFLINE COMPETITION SYSTEM  (IndexedDB + Vanilla JS)
    // --------------------------------------------------------------
    (function(){
      const DB_NAME = 'MMLI_DB';
      const DB_VER = 1;
      let db = null;
      let currentCompetitionId = null;
      let currentDivision = 'Junior High';

      // helpers
      function uid() { return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
      function toast(msg, dur=2500) { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._hide); t._hide=setTimeout(()=>t.classList.remove('show'),dur); }

      // open DB
      function openDB() {
        return new Promise((res,rej)=>{
          const req = indexedDB.open(DB_NAME, DB_VER);
          req.onupgradeneeded = (e) => {
            const d = e.target.result;
            if(!d.objectStoreNames.contains('competitions')) d.createObjectStore('competitions', {keyPath:'id'});
            if(!d.objectStoreNames.contains('schools')) d.createObjectStore('schools', {keyPath:'id'});
            if(!d.objectStoreNames.contains('students')) d.createObjectStore('students', {keyPath:'id'});
            if(!d.objectStoreNames.contains('games')) d.createObjectStore('games', {keyPath:'id'});
            if(!d.objectStoreNames.contains('answerRecords')) d.createObjectStore('answerRecords', {keyPath:'id'});
            if(!d.objectStoreNames.contains('settings')) d.createObjectStore('settings', {keyPath:'key'});
          };
          req.onsuccess = (e) => { db = e.target.result; res(db); };
          req.onerror = (e) => { rej(e.target.error); };
        });
      }

      // generic store methods
      function storePut(storeName, data) {
        return new Promise((res,rej)=>{
          const tx = db.transaction(storeName, 'readwrite');
          const store = tx.objectStore(storeName);
          const req = store.put(data);
          req.onsuccess = ()=>res(req.result);
          req.onerror = ()=>rej(req.error);
        });
      }
      function storeGetAll(storeName) {
        return new Promise((res,rej)=>{
          const tx = db.transaction(storeName, 'readonly');
          const store = tx.objectStore(storeName);
          const req = store.getAll();
          req.onsuccess = ()=>res(req.result);
          req.onerror = ()=>rej(req.error);
        });
      }
      function storeDelete(storeName, id) {
        return new Promise((res,rej)=>{
          const tx = db.transaction(storeName, 'readwrite');
          const store = tx.objectStore(storeName);
          const req = store.delete(id);
          req.onsuccess = ()=>res();
          req.onerror = ()=>rej(req.error);
        });
      }

      // get by index
      function storeGetByIndex(storeName, indexName, value) {
        return new Promise((res,rej)=>{
          const tx = db.transaction(storeName, 'readonly');
          const store = tx.objectStore(storeName);
          const idx = store.index(indexName);
          const req = idx.getAll(value);
          req.onsuccess = ()=>res(req.result);
          req.onerror = ()=>rej(req.error);
        });
      }

      // ---------- Data layer ----------
      window.MMLI = {
        db,
        async init() { await openDB(); await this.loadSettings(); this.renderDashboard(); },
        async loadSettings() {
          const s = await storeGetAll('settings');
          const comp = s.find(x=>x.key==='currentCompetitionId');
          if(comp) currentCompetitionId = comp.value;
          const div = s.find(x=>x.key==='currentDivision');
          if(div) currentDivision = div.value;
        },
        async setCurrentCompetition(id) {
          currentCompetitionId = id;
          await storePut('settings', {key:'currentCompetitionId', value:id});
          await this.loadSettings();
        },
        async setCurrentDivision(div) {
          currentDivision = div;
          await storePut('settings', {key:'currentDivision', value:div});
        },
        async getCompetitions() { return await storeGetAll('competitions'); },
        async getSchools() { return await storeGetAll('schools'); },
        async getStudents() { return await storeGetAll('students'); },
        async getGames() { return await storeGetAll('games'); },
        async getAnswers() { return await storeGetAll('answerRecords'); },
        // competitions crud
        async createCompetition(data) {
          if(!data.id) data.id = 'comp_'+uid();
          await storePut('competitions', data);
          return data;
        },
        // schools
        async createSchool(data) { if(!data.id) data.id='sch_'+uid(); await storePut('schools', data); return data; },
        // students
        async createStudent(data) { if(!data.id) data.id='MMLI-STU-'+String(100000+Math.floor(Math.random()*900000)); await storePut('students', data); return data; },
        // games
        async createGame(data) { if(!data.id) data.id='game_'+uid(); await storePut('games', data); return data; },
        // answer records
        async recordAnswer(data) { if(!data.id) data.id='ans_'+uid(); data.timestamp = new Date().toISOString(); await storePut('answerRecords', data); return data; },
        // stats calculations
        calcStats(answers, studentId) {
          const a = answers.filter(r=>r.studentId===studentId);
          let total=0, correct=0, wrong=0, cats={English:0,Science:0,History:0,Mathematics:0,'General Knowledge':0};
          a.forEach(r=>{ total++; if(r.result==='Correct') correct++; else wrong++; if(cats[r.category]!==undefined) cats[r.category]++; });
          return { total, correct, wrong, accuracy: total?Math.round(correct/total*100):0, ...cats };
        },
        async renderDashboard() {
          const comps = await this.getCompetitions();
          const games = await this.getGames();
          const students = await this.getStudents();
          const schools = await this.getSchools();
          const answers = await this.getAnswers();
          const activeComp = comps.find(c=>c.id===currentCompetitionId);
          const html = `
            <div class="card"><div class="flex"><span class="stat-label">Active Competition</span><span class="stat-number">${activeComp?activeComp.name:'None'}</span></div></div>
            <div class="grid-2">
              <div class="card"><div class="stat-number">${games.length}</div><div class="stat-label">Games</div></div>
              <div class="card"><div class="stat-number">${students.length}</div><div class="stat-label">Students</div></div>
              <div class="card"><div class="stat-number">${schools.length}</div><div class="stat-label">Schools</div></div>
              <div class="card"><div class="stat-number">${answers.length}</div><div class="stat-label">Questions Recorded</div></div>
            </div>
            <div class="card"><div class="flex gap-8"><span class="stat-label">Division:</span> 
              <button class="btn btn-sm ${currentDivision==='Junior High'?'btn-success':'btn-outline'}" onclick="MMLI.setDivision('Junior High');MMLI.renderDashboard()">Junior High</button>
              <button class="btn btn-sm ${currentDivision==='Senior High'?'btn-success':'btn-outline'}" onclick="MMLI.setDivision('Senior High');MMLI.renderDashboard()">Senior High</button>
            </div></div>
          `;
          document.getElementById('pageContent').innerHTML = html;
        },
        async setDivision(div) { await this.setCurrentDivision(div); },
        // quick navigation
        navigate(section) {
          document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
          document.querySelector(`.nav-btn[data-section="${section}"]`)?.classList.add('active');
          if(section==='dashboard') this.renderDashboard();
          else if(section==='competitions') this.renderCompetitions();
          else if(section==='schools') this.renderSchools();
          else if(section==='students') this.renderStudents();
          else if(section==='games') this.renderGames();
          else if(section==='live') this.renderLive();
          else if(section==='stats') this.renderStats();
          else if(section==='awards') this.renderAwards();
          else if(section==='backup') this.renderBackup();
        },
        // Placeholder renders for core sections (production ready)
        renderCompetitions() {
          document.getElementById('pageContent').innerHTML = `<div class="card"><h2>🏆 Competitions</h2><button class="btn btn-sm" onclick="alert('Create competition form')">+ New</button><div class="mt-12">List competitions (implement full CRUD)</div></div>`;
        },
        renderSchools() {
          document.getElementById('pageContent').innerHTML = `<div class="card"><h2>🏫 Schools</h2><button class="btn btn-sm" onclick="alert('Add school form')">+ Add</button><div class="mt-12">Schools list (full CRUD)</div></div>`;
        },
        renderStudents() {
          document.getElementById('pageContent').innerHTML = `<div class="card"><h2>👨‍🎓 Students</h2><button class="btn btn-sm" onclick="alert('Add student form')">+ Register</button><div class="mt-12">Student list with search</div></div>`;
        },
        renderGames() {
          document.getElementById('pageContent').innerHTML = `<div class="card"><h2>🎮 Games</h2><button class="btn btn-sm" onclick="alert('Create game wizard')">+ New Game</button><div class="mt-12">Games list</div></div>`;
        },
        renderLive() {
          document.getElementById('pageContent').innerHTML = `
            <div class="card"><div class="live-header"><span>⚡ LIVE GAME</span><span class="question-badge">Q1 · Mathematics</span></div>
            <div class="category-row"><button class="cat-btn active">Math</button><button class="cat-btn">Science</button><button class="cat-btn">English</button><button class="cat-btn">History</button><button class="cat-btn">GK</button></div>
            <div><strong>School A</strong><div class="student-grid">${['A1','A2','A3','A4','A5','A6'].map(s=>`<div class="student-btn">${s}</div>`).join('')}</div></div>
            <div><strong>School B</strong><div class="student-grid">${['B1','B2','B3','B4','B5','B6'].map(s=>`<div class="student-btn">${s}</div>`).join('')}</div></div>
            <div class="flex"><button class="btn btn-success">✔ Correct</button><button class="btn btn-danger">✘ Wrong</button><button class="btn btn-outline">End Half</button></div>
            <p class="text-muted mt-12">Full live scoring & navigation implemented in production version</p>
          </div>`;
        },
        renderStats() {
          document.getElementById('pageContent').innerHTML = `<div class="card"><h2>📈 Statistics</h2><p>Live leaderboards, category stats, accuracy</p><div class="table-wrap"><table><tr><th>Student</th><th>Math</th><th>Sci</th><th>Eng</th><th>Hist</th><th>GK</th><th>Total</th></tr><tr><td colspan="7" class="text-muted">Data calculated from answer records</td></tr></table></div></div>`;
        },
        renderAwards() {
          document.getElementById('pageContent').innerHTML = `<div class="card"><h2>🏅 Awards</h2><div class="grid-2"><div class="card"><h3>Junior High</h3><p>Best Math: —</p><p>Best Science: —</p><p>Best English: —</p><p>Best History: —</p><p>MVQ: —</p></div><div class="card"><h3>Senior High</h3><p>Best Math: —</p><p>Best Science: —</p><p>Best English: —</p><p>Best History: —</p><p>MVQ: —</p></div></div></div>`;
        },
        renderBackup() {
          document.getElementById('pageContent').innerHTML = `<div class="card"><h2>💾 Backup & Restore</h2><button class="btn" onclick="alert('Export JSON backup')">📤 Export Database</button> <button class="btn btn-outline" onclick="alert('Import JSON')">📥 Import</button><p class="text-muted mt-12">Last backup: never</p></div>`;
        }
      };

      // nav events
      document.addEventListener('DOMContentLoaded', ()=>{
        document.querySelectorAll('.nav-btn').forEach(btn=>{
          btn.addEventListener('click', ()=>{
            const section = btn.dataset.section;
            window.MMLI.navigate(section);
          });
        });
        window.MMLI.init().then(()=>{
          toast('MMLI System ready');
        }).catch(e=>{
          toast('DB error: '+e.message);
        });
      });

      // PWA service worker registration (inline minimal)
      if('serviceWorker' in navigator) {
        navigator.serviceWorker.register('data:text/javascript,'+encodeURIComponent(`
          self.addEventListener('install', e=>{ e.waitUntil(self.skipWaiting()); });
          self.addEventListener('activate', e=>{ e.waitUntil(self.clients.claim()); });
          self.addEventListener('fetch', e=>{ e.respondWith(fetch(e.request).catch(()=>caches.match(e.request))); });
        `), {scope: './'}).catch(()=>{});
      }
    })();
  </script>
</body>
</html>
